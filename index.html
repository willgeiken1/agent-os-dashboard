/* Additions for live data */
.signin{max-width:440px;margin:12vh auto 0;padding:0 16px}
.signin .panel{padding:32px}
.signin label{display:grid;gap:6px;margin-bottom:16px}.signin label span{color:var(--muted);font-size:14px}
.signin .check{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.signin .check input{width:20px;min-height:20px;accent-color:var(--accent)}
.err{color:#f0b3a1}
.nav a .count,.mobile-nav a .count{margin-left:auto;background:var(--accent);color:var(--ink);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}
.mobile-nav a{position:relative}.mobile-nav a .count{position:absolute;top:2px;right:8px;margin:0}
.badge.ok{color:#a9d8b2}.badge.danger{color:#f0b3a1}.badge.ok .dot{background:#9fd3a9}.badge.danger .dot{background:#e7a38f}
.timeline{list-style:none;padding:0}.stage.failed{border-color:#e7a38f;color:#f0b3a1}
.message.pending{border-style:dashed}.message.pending p{margin-top:4px;color:var(--muted)}.message.failed{border-color:#86523f}
.review-answer{max-width:none;margin-top:12px}
.trust{margin-top:12px;line-height:1.6}
.obs-link{color:inherit;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.bot.inactive{opacity:.6}.bot .thread-select{flex:1 1 180px;min-width:0;max-width:100%}.note-suggestion pre{white-space:pre-wrap}
.state-returned{color:#a9d8b2}.state-blocked,.state-failed,.state-stale{color:#f0b3a1}.state-running{color:var(--accent)}
.stat{font-size:30px;font-weight:600;line-height:1.2;margin:8px 0 4px}
.note h2{font-size:18px}.note .list-row:first-of-type{padding-top:8px}
.control-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.scope dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.scope dt{opacity:.8}
.cream .scope dt{color:#465848;opacity:1}.cream details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:14px}
.approval-item:first-child{border-top:0;margin-top:8px;padding-top:4px}
.form-pair{gap:12px;align-items:flex-start}.form-pair label{flex:1 1 160px}
dialog h3{margin:20px 0 8px}dialog details{margin:8px 0}dialog form label{display:grid;gap:6px;margin-bottom:16px}dialog form label span{color:var(--muted);font-size:14px}
.notice.row{padding:8px 8px 8px 16px}
.composer .micro{margin-top:0}
.focus-mode .support-column{display:none}
.widget[draggable=true]{cursor:default}
dialog pre{font-family:inherit}
#pause-button,.brand{white-space:nowrap}
.note-grid{align-items:start}
.elliot{display:flex;flex-direction:column;align-self:start}
.elliot .conversation{height:max(320px,calc(100dvh - 400px))}
.focus-mode .elliot .conversation{height:calc(100dvh - 330px)}
.elliot-head>.row{min-width:0}.elliot-head{flex-wrap:nowrap;align-items:flex-start}
/* Home board */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
@keyframes breathe{0%,100%{box-shadow:0 0 14px #98c7a130,0 0 0 0 #9fd3a944}50%{box-shadow:0 0 30px #98c7a160,0 0 0 10px #9fd3a900}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.enter .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),14) * 45ms)}
.enter .ring-fill{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both .15s}
.ring-fill{transition:stroke-dashoffset .6s}
.dot.pulse{color:#f2cd8566;animation:pulse 1.8s infinite}.badge.ok .dot.pulse{color:#9fd3a955}
.button-link{color:var(--accent);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;min-height:44px}.button-link:hover{text-decoration:underline}
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#d6be7a1c,transparent 65%);pointer-events:none}
.hero-main{display:grid;gap:14px;min-width:0}.hero-top{gap:16px}.hero h1{font-size:32px}
.hero-orb{width:58px;height:58px;position:relative}.hero-orb.live{animation:breathe 4s ease-in-out infinite}
.hero-orb.busy:before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);border-right-color:#d6be7a55;animation:spin 1.4s linear infinite}
.hero-orb.sleep{filter:saturate(.4) brightness(.8)}
.hero-line{font-size:18px;color:var(--text);max-width:640px}
.quick-ask{display:flex;align-items:center;gap:8px;background:#0b1f17cc;border:1px solid #66866c;border-radius:20px;padding:6px 6px 6px 16px;max-width:720px;transition:border-color .2s,box-shadow .2s}
.quick-ask:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px #d6be7a22}
.quick-ask>.icon{color:var(--muted)}.quick-ask input{border:0;background:transparent;min-width:0;flex:1;padding:10px 4px;outline:none}
.quick-ask input:focus-visible{outline:none}.quick-ask .thread-select{max-width:130px;background:#10251c}
.hero-links{gap:16px}.hero-links .micro{margin:0}
.hero-gauge{display:grid;justify-items:center;gap:6px;text-align:center}
.gauge-ring{position:relative;width:118px;height:118px}.gauge-text{position:absolute;inset:0;display:grid;place-content:center;line-height:1.1}
.gauge-text strong{font-size:30px;font-weight:650}.gauge-text span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.tile{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;justify-items:start;align-items:center;text-align:left;
 padding:16px 18px;border-radius:20px;background:var(--surface);min-height:84px;overflow:hidden;transition:transform .18s,border-color .18s,background .18s}
.tile:hover{transform:translateY(-2px);background:var(--surface);border-color:#63836b}.tile:active{transform:translateY(0) scale(.98)}
.tile-icon{grid-row:1/3;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#1b3a2b;color:var(--muted)}
.tile-num{font-size:28px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}.tile-label{font-size:13px;color:var(--muted)}
.tile.hot{border-color:#8a7440;background:linear-gradient(135deg,#2c2a16,#10251c 70%)}.tile.hot .tile-icon{background:var(--accent);color:var(--ink)}
.glow{--mx:50%;--my:-200px}
.glow:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
 background:radial-gradient(260px circle at var(--mx) var(--my),#d6be7a17,transparent 70%)}
.glow:hover:after{opacity:1}
.board{display:grid;gap:20px;align-content:start;min-width:0}
.board-head{margin-top:4px}.board-head h2{font-size:22px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap}
.chip.filter{gap:8px;padding:4px 12px;min-height:36px;font-size:13px;color:var(--muted)}
.chip.filter.active{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}
.chip-count{font-size:11px;background:#ffffff14;border-radius:99px;padding:0 7px}.chip.filter.active .chip-count{background:#17291f22}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.project-card{position:relative;padding:20px;border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--hue) 9%,var(--surface)),var(--surface) 120px);
 border:1px solid var(--line);border-top:3px solid var(--hue);transition:transform .18s,border-color .18s,box-shadow .18s;display:grid;gap:14px}
.project-card:hover{box-shadow:0 14px 34px #0006;border-color:color-mix(in srgb,var(--hue) 45%,var(--line));border-top-color:var(--hue)}
.pc-head{display:flex;align-items:center;gap:14px}.pc-title{flex:1;min-width:0}.pc-title h2{font-size:19px}.pc-title p{margin-top:2px}
.pc-ring{position:relative;width:52px;height:52px;flex:none}.pc-pct{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600}
.lane-bar{display:flex;gap:3px;height:8px;border-radius:8px;overflow:hidden}.lane-bar.empty-bar{background:#254636}
.seg{min-width:8px;border-radius:3px}
.lane-needs{--lane:#e7c46f}.lane-review{--lane:#f4eddb}.lane-running{--lane:#9fd3a9}.lane-bot{--lane:#8fb4e3}.lane-queued{--lane:#4f6f5c}
.seg{background:var(--lane)}.seg.lane-running{animation:pulse 1.8s infinite;color:#9fd3a955}
.board-list{display:grid;gap:4px}
.board-row{display:flex;align-items:flex-start;gap:12px;justify-content:flex-start;text-align:left;border:1px solid transparent;border-radius:14px;padding:9px 10px;width:100%;min-height:52px}
.board-row:hover{background:#ffffff08;border-color:var(--line)}
.lane-dot{width:9px;height:9px;border-radius:50%;background:var(--lane);margin-top:7px;flex:none}
.board-row.lane-running .lane-dot{animation:pulse 1.8s infinite;color:#9fd3a955}
.board-text{display:grid;min-width:0}.board-title{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<script>
'use strict';
// Agent OS dashboard. Talks to Supabase directly with the publishable key and the owner's own
// sign-in. Every read and change is checked by row-level security and owner-checked functions;
// nothing here can bypass them. No service-role key, model key or password is stored.
const BASE='https://fchitebejupdcpdartrk.supabase.co';
const KEY='sb_publishable_8ajbWJ7jClszIPQSgt8_jw__9v31eqi';
const PROJECTS=['Agent OS','Insight','Roblox','Growth','Markets','Repo Watch','Team','AI OS'];
const EXECUTORS=['Claude','ChatGPT','Codex','Grok','Manual'];
const ASK_TEMPLATES=[['research','Ask'],['read','Read a note'],['summarize','Summarize'],['draft','Draft']];
const TEMPLATE_LABEL={read:'Read a note',summarize:'Summarize notes',research:'Research the vault',draft:'Draft text'};
const ERROR_TEXT={model_limit:'Hit the Claude subscription limit',model_error:'The model returned an error',timeout:'Ran out of time',
 tool_violation:'Tried a tool it was not allowed',invalid_output:'Returned an unusable answer',authorization_lost:'Stopped because its approval ended',
 stopped:'Stopped by pause',worker_error:'The Mac worker hit an error',stale:'The worker stopped before returning'};
const CANCELLED='Cancelled from the dashboard';
const VIEWS=[['home','Home','i-home'],['chat','Elliot','i-chat'],['tasks','Tasks','i-tasks'],['review','Review','i-review'],['bots','Bots','i-bot'],['control','Control','i-settings']];

// ---------- small helpers ----------
const $=id=>document.getElementById(id);
function el(tag,attrs={},...kids){
 const n=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs||{})){
  if(v==null||v===false)continue;
  if(k==='class')n.className=v;else if(k==='text')n.textContent=v;
  else if(k.startsWith('on')&&typeof v==='function')n.addEventListener(k.slice(2),v);
  else n.setAttribute(k,v===true?'':v);
 }
 for(const k of kids.flat()){if(k==null||k===false)continue;n.append(k)}
 return n;
}
const icon=name=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','icon');s.setAttribute('aria-hidden','true');
 const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#'+name);s.append(u);return s};
const store={
 get(k,d){try{const v=localStorage.getItem('agent-os:'+k);return v==null?d:JSON.parse(v)}catch{return d}},
 set(k,v){try{localStorage.setItem('agent-os:'+k,JSON.stringify(v))}catch{}},
 del(k){try{localStorage.removeItem('agent-os:'+k)}catch{}},
};
const fmtTime=t=>t?new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'';
const fmtWhen=t=>{if(!t)return 'never';const d=new Date(t),now=new Date();
 return d.toDateString()===now.toDateString()?fmtTime(t):d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
const ago=t=>{if(!t)return 'never';const s=Math.round((Date.now()-new Date(t))/1000);
 if(s<60)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'};
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
let toastTimer;
function toast(msg){const t=$('toast');clearInterval(undoTimer);t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,5000)}
// Undo: an approval only starts a run after 10 seconds (the database enforces it), so this button can take it back first.
let undoTimer;
function undoToast(msg,undo){
 const t=$('toast');clearTimeout(toastTimer);clearInterval(undoTimer);
 let left=10;const btn=el('button',{class:'toast-undo',id:'undo'},'Undo '+left);
 btn.onclick=async()=>{clearInterval(undoTimer);btn.disabled=true;
  try{await undo();toast('Undone. Nothing ran.')}catch(err){if(!err.signedOut)toast('Could not undo: '+err.message)}finally{await load()}};
 t.replaceChildren(el('span',{},msg),btn);t.hidden=false;
 undoTimer=setInterval(()=>{left--;if(left<=0){clearInterval(undoTimer);t.hidden=true}else btn.textContent='Undo '+left},1000);
}

// ---------- session ----------
let session=null,refreshing=null;
const remembered=()=>!!store.get('remember',false);
async function http(path,{method='GET',body,auth=true,prefer}={}){
 if(auth){if(!session)throw Object.assign(Error('Signed out'),{signedOut:true});
  if(session.expires_at*1000-Date.now()<60000)await refreshSession()}
 const headers={apikey:KEY,Authorization:'Bearer '+(auth?session.access_token:KEY),'Content-Type':'application/json'};
 if(prefer)headers.Prefer=prefer;
 let r;
 try{r=await fetch(BASE+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)})}
 catch{throw Object.assign(Error('Could not reach Supabase. Check your connection.'),{offline:true})}
 const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}
 if(!r.ok){
  if(r.status===401&&auth){endSession('Your session ended. Sign in again.');throw Object.assign(Error('Signed out'),{signedOut:true})}
  throw Error((data&&(data.message||data.error_description||data.msg||data.error))||('HTTP '+r.status));
 }
 return data;
}
function keep(s){session=s;if(remembered()&&s&&s.refresh_token)store.set('refresh',s.refresh_token)}
async function refreshSession(token){
 if(refreshing)return refreshing;
 refreshing=(async()=>{try{keep(await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:token||session.refresh_token}}))}
  finally{refreshing=null}})();
 return refreshing;
}
const rpc=(name,args={})=>http('/rest/v1/rpc/'+name,{method:'POST',body:args});

function endSession(msg){
 session=null;clearInterval(pollTimer);store.del('refresh');
 $('app').hidden=true;$('mobile-nav').hidden=true;$('signin').hidden=false;$('signin-error').textContent=msg||'';
}
async function signOut(){
 const s=session;endSession('');
 if(s)try{await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}})}catch{}
}
async function enter(){
 const owners=await http('/rest/v1/ai_os_owners?select=user_id');
 if(!owners||!owners.length){await signOut();$('signin-error').textContent='That account is not the Agent OS owner.';return}
 $('signin').hidden=true;$('app').hidden=false;$('mobile-nav').hidden=false;
 const tps=await http('/rest/v1/ai_os_task_templates?select=key,label,instructions,tools,max_model_calls,max_turns,timeout_seconds');
 state.templates=Object.fromEntries(tps.map(t=>[t.key,t]));
 await load();startPolling();route();
}

// ---------- data ----------
const state={status:null,tasks:[],approvals:[],runs:[],bots:[],assignments:[],notes:[],routines:[],week:null,summaries:[],templates:{},loadedAt:null,error:''};
let pollTimer=null;
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(document.visibilityState==='visible')load()},20000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session)load()});
async function load(){
 try{
  const [status,tasks,approvals,runs,bots,assignments,notes,routines,week,summaries]=await Promise.all([
   rpc('ai_os_worker_status'),
   http('/rest/v1/ai_os_tasks?select=id,title,project,agent,executor,template,request,context,result,status,version,created_at,updated_at,requires_approval,proposed_by_run&order=created_at.desc&limit=300'),
   http('/rest/v1/ai_os_dispatch_approvals?select=id,task_id,task_version,approved_at,expires_at,revoked_at&order=approved_at.desc,id.desc&limit=300'),
   http('/rest/v1/ai_os_runs?select=id,task_id,task_version,template,authorized_by,state,claimed_at,finished_at,deadline_at,calls_used,model,result,error_kind,error,trust,history_path,knowledge_state,knowledge_path&order=claimed_at.desc&limit=300'),
   http('/rest/v1/ai_os_bots?select=id,name,role,platform,external_id,notes,active,connected,created_at&order=name.asc'),
   http('/rest/v1/ai_os_bot_assignments?select=task_id,bot_id,assigned_at'),
   http('/rest/v1/ai_os_note_suggestions?select=id,run_id,task_id,title,body,sources,state,path,created_at,decided_at&order=created_at.desc&limit=100'),
   http('/rest/v1/ai_os_routines?select=id,name,project,executor,template,bot_id,request,days,hour,minute,enabled,last_run_on,last_task_id&order=name.asc'),
   rpc('ai_os_weekly_summary_preview'),
   http('/rest/v1/ai_os_weekly_summaries?select=week_start,data,vault_path&order=week_start.desc&limit=12'),
  ]);
  // Quick actions and goals arrive with the Home features update; until then those widgets explain that.
  const soft=q=>http(q).catch(err=>{if(err.signedOut)throw err;return null});
  const [quick,goals,milestones,pinned,learnings]=await Promise.all([
   soft('/rest/v1/ai_os_quick_actions?select=id,label,request,project,template,position&order=position.asc,created_at.asc'),
   soft('/rest/v1/ai_os_project_goals?select=project,goal,due_on,updated_at'),
   soft('/rest/v1/ai_os_goal_milestones?select=id,project,title,due_on,done_at,position&order=position.asc,created_at.asc'),
   soft('/rest/v1/ai_os_pinned_facts?select=id,fact,position,updated_at&order=position.asc,updated_at.asc'),
   soft('/rest/v1/ai_os_learnings?select=id,run_id,task_id,kind,title,body,keywords,state,path,created_at&order=created_at.desc&limit=50')]);
  Object.assign(state,{quick,goals,milestones,pinned,learnings});
  if(view==='audit')loadAudit();
  Object.assign(state,{status,tasks,approvals,runs,bots,assignments,notes,routines,week,summaries,loadedAt:new Date().toISOString(),error:''});
 }catch(err){if(err.signedOut)return;state.error=err.message}
 render();
}
const taskById=id=>state.tasks.find(t=>t.id===id);
const runsFor=t=>state.runs.filter(r=>r.task_id===t.id);
const lastApproval=t=>state.approvals.find(a=>a.task_id===t.id);
function activeApproval(t){const a=lastApproval(t);
 return a&&!a.revoked_at&&a.task_version===t.version&&new Date(a.expires_at)>Date.now()?a:null}
const runnable=t=>t.executor==='Claude'&&!!t.template;
// Suggested tasks never run on a standing rule; the backend enforces the same.
const ruleOn=t=>!t.requires_approval&&!!(state.status&&state.status.rules&&state.status.rules[t.template]);
const workerOnline=()=>!!(state.status&&state.status.workers.some(w=>w.online));
const isCancelled=t=>t.status==='failed'&&t.result.startsWith(CANCELLED);

// One place that turns backend state into what the page says about a task.
function info(t){
 const runs=runsFor(t),last=runs[0];
 const running=runs.find(r=>r.task_version===t.version&&r.state==='running');
 if(t.status==='completed')return {stage:4,label:'Reviewed',tone:'ok',detail:'Accepted '+fmtWhen(t.updated_at)+'.'};
 if(t.status==='awaiting_review')return {stage:3,label:'Ready to review',tone:'attention',detail:last&&last.finished_at?'Returned '+fmtWhen(last.finished_at)+'.':'Waiting for your review.'};
 if(t.status==='failed'){
  if(isCancelled(t))return {stage:0,label:'Cancelled',tone:'danger',end:'Cancelled',detail:'Cancelled '+fmtWhen(t.updated_at)+'. Nothing else will run for it.'};
  if(t.result.startsWith('Rejected in review'))return {stage:3,label:'Rejected',tone:'danger',end:'Rejected',detail:'You rejected this result.'};
  const kind=last&&last.error_kind;
  const next=kind==='model_limit'?'Your Claude subscription limit was reached. Run it again once the limit resets; nothing switches to paid usage.'
   :kind==='stale'||kind==='worker_error'?'The worker stopped before returning a result. It was not retried, so nothing ran twice. Run it again when the Mac is awake.'
   :'It was not retried. Check the details, then run it again if you still want it.';
  return {stage:last&&last.state!=='running'?2:1,label:kind?ERROR_TEXT[kind]||'Failed':'Failed',tone:'danger',end:'Failed',detail:next};
 }
 // queued
 if(running)return {stage:2,label:'Running',tone:'attention',detail:'Started '+fmtWhen(running.claimed_at)+' on '+(state.status.workers[0]?state.status.workers[0].worker_id:'the Mac')+'.'};
 if(!runnable(t)){const b=botFor(t);
  return b?{stage:0,label:'With '+b.name,tone:'',detail:'Assigned to '+b.name+'. '+b.platform+' is not connected yet, so hand it over yourself and mark it done when it is handled.'}
   :{stage:0,label:'Manual handoff',tone:'',detail:t.executor+' tasks are not run by the Mac worker. Mark it done when it is handled.'}}
 const waitWorker=()=>state.status.paused?'The queue is paused, so it waits until you resume.'
  :workerOnline()?'The Mac worker will pick it up shortly.':'Approved, but the Mac worker is offline. It runs when the Mac wakes; this page cannot wake it.';
 if(ruleOn(t))return {stage:1,label:'Approved by rule',tone:'ok',detail:'Your '+(TEMPLATE_LABEL[t.template]||t.template)+' rule is on. '+waitWorker()};
 const a=activeApproval(t);
 if(a)return {stage:1,label:'Approved',tone:'ok',approval:a,detail:'Approved until '+fmtWhen(a.expires_at)+'. '+waitWorker()};
 const prev=lastApproval(t);
 if(prev&&prev.task_version===t.version){
  if(prev.revoked_at)return {stage:0,label:'Approval revoked',tone:'danger',needs:true,detail:'You revoked the approval. Approve again to run it.'};
  return {stage:0,label:'Approval expired',tone:'danger',needs:true,detail:'The approval expired before the worker ran it. Approve again to run it.'};
 }
 if(t.requires_approval)return {stage:0,label:'Suggested',tone:'attention',needs:true,
  detail:'A run suggested this after reading your vault. It runs only if you approve it; standing rules never apply to suggestions.'};
 return {stage:0,label:'Needs approval',tone:'attention',needs:true,detail:'Approve it to let the Mac worker run it once.'};
}
// Where an answer was filed and how its citations checked out.
const TRUST={verified:['Verified','ok','Every quote was found in its note. Saved to Knowledge.'],
 checked:['Checked','ok','Some quotes were missing, and a second check found the answer supported. Saved to Knowledge.'],
 unsupported:['Not supported','danger','A second check found the answer not supported by its notes. Kept in History only.'],
 borderline:['Your call','attention','Only some quotes were found and the second check was not conclusive. You decide whether it goes into Knowledge.'],
 unverified:['Unverified','danger','No quote could be found in the cited notes. Kept in History only.'],
 not_checked:['Draft','','Drafts are not trust checked. Kept in History only.']};
function trustInfo(run){
 const t=run&&run.trust;if(!t||!TRUST[t.status])return null;
 const [label,tone,detail]=TRUST[t.status];
 const ks=run.knowledge_state;
 const extra=ks==='approved'?' You approved it; the Mac saves it to Knowledge next time it checks in.':ks==='declined'?' You kept it in History only.':ks==='written'&&t.status==='borderline'?' You approved it and it is saved in Knowledge.':'';
 return {label,tone,detail:detail+extra,count:t.total?t.verified+' of '+t.total+' quotes found':'no citations'};
}
function trustLine(run){const i=trustInfo(run);if(!i)return '';
 return el('p',{class:'small trust'},badge(i.label,i.tone),' '+i.count+'. '+i.detail+(run.history_path?' File: ':''),run.history_path?obsLink(run.knowledge_path||run.history_path):'')}
const knowledgePending=()=>(state.status&&state.status.knowledge_pending)||[];
const decideKnowledge=(runId,promote)=>rpc('ai_os_knowledge_decide',{p_run_id:runId,p_promote:promote});
function knowledgeButtons(runId){
 const b=(label,cls,promote,ok)=>el('button',{class:cls,onclick:e=>act(e.currentTarget,()=>decideKnowledge(runId,promote),ok)},label);
 return [b('Save to Knowledge','primary',true,'Approved. The Mac saves it to Knowledge next time it checks in.'),b('Keep in History only','',false,'Kept in History only.')];
}
const needsApproval=()=>state.tasks.filter(t=>t.status==='queued'&&runnable(t)&&info(t).needs);
const toReview=()=>state.tasks.filter(t=>t.status==='awaiting_review');
const notesPending=()=>state.notes.filter(n=>n.state==='pending');
const learningsPending=()=>(state.learnings||[]).filter(n=>n.state==='pending');
const waitingCount=()=>needsApproval().length+knowledgePending().length+notesPending().length+learningsPending().length;
// Opens a vault file in Obsidian (the vault the Mac worker reads).
const VAULT_NAME='Second Brain';
const obsidianUrl=path=>'obsidian://open?vault='+encodeURIComponent(VAULT_NAME)+'&file='+encodeURIComponent(String(path).replace(/\.md$/i,''));
const obsLink=(path,label)=>el('a',{class:'obs-link',href:obsidianUrl(path),title:'Open '+path+' in Obsidian'},label||path);
const obsLinks=paths=>paths.filter(Boolean).flatMap((p,i)=>i?[' and ',obsLink(p)]:[obsLink(p)]);
// Bots: a manual label for now. Nothing here sends anything to Grok.
const botFor=t=>{const a=state.assignments.find(x=>x.task_id===t.id);return a?state.bots.find(b=>b.id===a.bot_id):null};
const tasksFor=b=>state.assignments.filter(a=>a.bot_id===b.id).map(a=>taskById(a.task_id)).filter(Boolean);
const assignable=t=>['Grok','ChatGPT','Codex','Manual'].includes(t.executor);
const botExecutor=b=>b.platform==='ChatGPT'?'ChatGPT':b.platform==='Grok Bot'?'Grok':'Manual';
const assignBot=(t,botId)=>rpc('ai_os_bot_assign',{p_task_id:t.id,p_bot_id:botId||null});

// ---------- actions ----------
// A small burst of gold dots from the button when an action lands.
function burst(btn){
 if(!btn||!btn.isConnected||matchMedia('(prefers-reduced-motion: reduce)').matches||store.get('flat',false))return;
 const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#d6be7a','#9fd3a9','#f4eddb','#7fc8b5'];
 for(let i=0;i<14;i++){const a=Math.PI*2*i/14+Math.random()*.4,d=36+Math.random()*34,size=4+Math.random()*4;
  const p=el('span',{class:'burst',style:'left:'+cx+'px;top:'+cy+'px;width:'+size+'px;height:'+size+'px;background:'+cols[i%4]});document.body.append(p);
  p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+(Math.cos(a)*d)+'px),calc(-50% + '+(Math.sin(a)*d)+'px)) scale(.3)',opacity:0}],
   {duration:600+Math.random()*250,easing:'cubic-bezier(.2,.8,.3,1)'}).onfinish=()=>p.remove()}
}
async function act(btn,fn,ok){
 if(btn)btn.disabled=true;
 try{await fn();if(ok)toast(ok);burst(btn)}catch(err){if(!err.signedOut)toast(err.message)}
 finally{if(btn)btn.disabled=false;await load()}
}
async function setStatus(t,status,result){

// On touch screens approval takes a deliberate press-and-hold while a fill sweeps across the button,

const HOLD_MS=650;

 const stop=()=>{clearTimeout(timer);timer=null;btn.classList.remove('holding')};
 btn.addEventListener('pointerdown',e=>{touch=e.pointerType!=='mouse';held=false;if(!touch)return;
  btn.style.setProperty('--hold',HOLD_MS+'ms');btn.classList.add('holding');
  timer=setTimeout(()=>{held=true;stop();navigator.vibrate&&navigator.vibrate(15);act(btn,fn,ok)},HOLD_MS)});
 for(const ev of ['pointerup','pointerleave','pointercancel'])btn.addEventListener(ev,stop);
 btn.addEventListener('contextmenu',e=>{if(touch)e.preventDefault()});

   if(!compact)out.push(holdButton('Approve for 24 hours','',approveWithUndo(t,24,'Approved for 24 hours.')))}
  if(i.approval)out.push(b('Revoke approval','',()=>revoke(t,i.approval),'Approval revoked.'));

   store.set('mic-ok',true)}
  rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=false;rec.continuous=false;
  const base=ta.value;
  rec.onresult=e=>{const words=Array.from(e.results).map(r=>r[0].transcript).join(' ');ta.value=(base?base+' ':'')+words;ta.dispatchEvent(new Event('input'))};
  rec.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Microphone access was refused. Allow it in your browser settings to dictate.':'Voice input stopped: '+e.error);
  rec.onend=()=>{rec=null;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','Dictate a message');ta.focus()};
  try{rec.start();b.setAttribute('aria-pressed','true');b.setAttribute('aria-label','Stop dictating')}catch(err){rec=null;toast('Voice input could not start.')}

});
// A soft light follows the pointer across cards on desktop.
$('view').addEventListener('pointermove',e=>{const c=e.target.closest&&e.target.closest('.glow');if(!c||e.pointerType!=='mouse')return;
 const r=c.getBoundingClientRect();c.style.setProperty('--mx',(e.clientX-r.left)+'px');c.style.setProperty('--my',(e.clientY-r.top)+'px')});
$('remember').checked=remembered();
(async()=>{
 const token=store.get('refresh',null);
 if(token&&remembered()){try{await refreshSession(token);await enter();return}catch{store.del('refresh')}}
 $('signin').hidden=false;
})();

// Home Screen app: cache the page so it opens offline and shows the last data with a notice.
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

</script>
</body>
