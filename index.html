const store={
 get(k,d){try{const v=localStorage.getItem('agent-os:'+k);return v==null?d:JSON.parse(v)}catch{return d}},
 set(k,v){try{localStorage.setItem('agent-os:'+k,JSON.stringify(v))}catch{}},
 del(k){try{localStorage.removeItem('agent-os:'+k)}catch{}},
};
const fmtTime=t=>t?new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'';
const fmtWhen=t=>{if(!t)return 'never';const d=new Date(t),now=new Date();
 return d.toDateString()===now.toDateString()?fmtTime(t):d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
const ago=t=>{if(!t)return 'never';const s=Math.round((Date.now()-new Date(t))/1000);
 if(s<60)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'};
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,5000)}

// ---------- session ----------
let session=null,refreshing=null;
const remembered=()=>!!store.get('remember',false);
async function http(path,{method='GET',body,auth=true,prefer}={}){
 if(auth){if(!session)throw Object.assign(Error('Signed out'),{signedOut:true});
  if(session.expires_at*1000-Date.now()<60000)await refreshSession()}
 const headers={apikey:KEY,Authorization:'Bearer '+(auth?session.access_token:KEY),'Content-Type':'application/json'};
 if(prefer)headers.Prefer=prefer;
 let r;
 try{r=await fetch(BASE+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)})}
 catch{throw Object.assign(Error('Could not reach Supabase. Check your connection.'),{offline:true})}
 const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}
 if(!r.ok){
  if(r.status===401&&auth){endSession('Your session ended. Sign in again.');throw Object.assign(Error('Signed out'),{signedOut:true})}
  throw Error((data&&(data.message||data.error_description||data.msg||data.error))||('HTTP '+r.status));
 }
 return data;
}
function keep(s){session=s;if(remembered()&&s&&s.refresh_token)store.set('refresh',s.refresh_token)}
async function refreshSession(token){
 if(refreshing)return refreshing;
 refreshing=(async()=>{try{keep(await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:token||session.refresh_token}}))}
  finally{refreshing=null}})();
 return refreshing;
}
const rpc=(name,args={})=>http('/rest/v1/rpc/'+name,{method:'POST',body:args});

function endSession(msg){
 session=null;clearInterval(pollTimer);store.del('refresh');
 $('app').hidden=true;$('mobile-nav').hidden=true;$('signin').hidden=false;$('signin-error').textContent=msg||'';
}
async function signOut(){
 const s=session;endSession('');
 if(s)try{await fetch(BASE+'/auth/v1/logout',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+s.access_token}})}catch{}
}
async function enter(){
 const owners=await http('/rest/v1/ai_os_owners?select=user_id');
 if(!owners||!owners.length){await signOut();$('signin-error').textContent='That account is not the Agent OS owner.';return}
 $('signin').hidden=true;$('app').hidden=false;$('mobile-nav').hidden=false;
 const tps=await http('/rest/v1/ai_os_task_templates?select=key,label,instructions,tools,max_model_calls,max_turns,timeout_seconds');
 state.templates=Object.fromEntries(tps.map(t=>[t.key,t]));
 await load();startPolling();route();
}

// ---------- data ----------
const state={status:null,tasks:[],approvals:[],runs:[],bots:[],assignments:[],notes:[],templates:{},loadedAt:null,error:''};
let pollTimer=null;
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>{if(document.visibilityState==='visible')load()},20000)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&session)load()});
async function load(){
 try{
  const [status,tasks,approvals,runs,bots,assignments,notes]=await Promise.all([
   rpc('ai_os_worker_status'),
   http('/rest/v1/ai_os_tasks?select=id,title,project,agent,executor,template,request,context,result,status,version,created_at,updated_at,requires_approval,proposed_by_run&order=created_at.desc&limit=300'),
   http('/rest/v1/ai_os_dispatch_approvals?select=id,task_id,task_version,approved_at,expires_at,revoked_at&order=approved_at.desc,id.desc&limit=300'),
   http('/rest/v1/ai_os_runs?select=id,task_id,task_version,template,authorized_by,state,claimed_at,finished_at,deadline_at,calls_used,model,result,error_kind,error,trust,history_path,knowledge_state,knowledge_path&order=claimed_at.desc&limit=300'),
   http('/rest/v1/ai_os_bots?select=id,name,role,platform,external_id,notes,active,connected,created_at&order=name.asc'),
   http('/rest/v1/ai_os_bot_assignments?select=task_id,bot_id,assigned_at'),
   http('/rest/v1/ai_os_note_suggestions?select=id,run_id,task_id,title,body,sources,state,path,created_at,decided_at&order=created_at.desc&limit=100'),
  ]);
  Object.assign(state,{status,tasks,approvals,runs,bots,assignments,notes,loadedAt:new Date().toISOString(),error:''});
 }catch(err){if(err.signedOut)return;state.error=err.message}
 render();
}
const taskById=id=>state.tasks.find(t=>t.id===id);
const runsFor=t=>state.runs.filter(r=>r.task_id===t.id);
const lastApproval=t=>state.approvals.find(a=>a.task_id===t.id);
function activeApproval(t){const a=lastApproval(t);
 return a&&!a.revoked_at&&a.task_version===t.version&&new Date(a.expires_at)>Date.now()?a:null}
const runnable=t=>t.executor==='Claude'&&!!t.template;
// Suggested tasks never run on a standing rule; the backend enforces the same.
const ruleOn=t=>!t.requires_approval&&!!(state.status&&state.status.rules&&state.status.rules[t.template]);
const workerOnline=()=>!!(state.status&&state.status.workers.some(w=>w.online));
const isCancelled=t=>t.status==='failed'&&t.result.startsWith(CANCELLED);

// One place that turns backend state into what the page says about a task.
function info(t){
 const runs=runsFor(t),last=runs[0];
 const running=runs.find(r=>r.task_version===t.version&&r.state==='running');
 if(t.status==='completed')return {stage:4,label:'Reviewed',tone:'ok',detail:'Accepted '+fmtWhen(t.updated_at)+'.'};
 if(t.status==='awaiting_review')return {stage:3,label:'Ready to review',tone:'attention',detail:last&&last.finished_at?'Returned '+fmtWhen(last.finished_at)+'.':'Waiting for your review.'};
 if(t.status==='failed'){
  if(isCancelled(t))return {stage:0,label:'Cancelled',tone:'danger',end:'Cancelled',detail:'Cancelled '+fmtWhen(t.updated_at)+'. Nothing else will run for it.'};
  if(t.result.startsWith('Rejected in review'))return {stage:3,label:'Rejected',tone:'danger',end:'Rejected',detail:'You rejected this result.'};
  const kind=last&&last.error_kind;
  const next=kind==='model_limit'?'Your Claude subscription limit was reached. Run it again once the limit resets; nothing switches to paid usage.'
   :kind==='stale'||kind==='worker_error'?'The worker stopped before returning a result. It was not retried, so nothing ran twice. Run it again when the Mac is awake.'
   :'It was not retried. Check the details, then run it again if you still want it.';
  return {stage:last&&last.state!=='running'?2:1,label:kind?ERROR_TEXT[kind]||'Failed':'Failed',tone:'danger',end:'Failed',detail:next};
 }
 // queued
 if(running)return {stage:2,label:'Running',tone:'attention',detail:'Started '+fmtWhen(running.claimed_at)+' on '+(state.status.workers[0]?state.status.workers[0].worker_id:'the Mac')+'.'};
 if(!runnable(t)){const b=botFor(t);
  return b?{stage:0,label:'With '+b.name,tone:'',detail:'Assigned to '+b.name+'. Grok is not connected yet, so hand it over yourself and mark it done when it is handled.'}
   :{stage:0,label:'Manual handoff',tone:'',detail:t.executor+' tasks are not run by the Mac worker. Mark it done when it is handled.'}}
 const waitWorker=()=>state.status.paused?'The queue is paused, so it waits until you resume.'
  :workerOnline()?'The Mac worker will pick it up shortly.':'Approved, but the Mac worker is offline. It runs when the Mac wakes; this page cannot wake it.';
 if(ruleOn(t))return {stage:1,label:'Approved by rule',tone:'ok',detail:'Your '+(TEMPLATE_LABEL[t.template]||t.template)+' rule is on. '+waitWorker()};
 const a=activeApproval(t);
 if(a)return {stage:1,label:'Approved',tone:'ok',approval:a,detail:'Approved until '+fmtWhen(a.expires_at)+'. '+waitWorker()};
 const prev=lastApproval(t);
 if(prev&&prev.task_version===t.version){
  if(prev.revoked_at)return {stage:0,label:'Approval revoked',tone:'danger',needs:true,detail:'You revoked the approval. Approve again to run it.'};
  return {stage:0,label:'Approval expired',tone:'danger',needs:true,detail:'The approval expired before the worker ran it. Approve again to run it.'};
 }
 if(t.requires_approval)return {stage:0,label:'Suggested',tone:'attention',needs:true,
  detail:'A run suggested this after reading your vault. It runs only if you approve it; standing rules never apply to suggestions.'};
 return {stage:0,label:'Needs approval',tone:'attention',needs:true,detail:'Approve it to let the Mac worker run it once.'};
}
// Where an answer was filed and how its citations checked out.
const TRUST={verified:['Verified','ok','Every quote was found in its note. Saved to Knowledge.'],
 checked:['Checked','ok','Some quotes were missing, and a second check found the answer supported. Saved to Knowledge.'],
 unsupported:['Not supported','danger','A second check found the answer not supported by its notes. Kept in History only.'],
 borderline:['Your call','attention','Only some quotes were found and the second check was not conclusive. You decide whether it goes into Knowledge.'],
 unverified:['Unverified','danger','No quote could be found in the cited notes. Kept in History only.'],
 not_checked:['Draft','','Drafts are not trust checked. Kept in History only.']};
function trustInfo(run){
 const t=run&&run.trust;if(!t||!TRUST[t.status])return null;
 const [label,tone,detail]=TRUST[t.status];
 const ks=run.knowledge_state;
 const extra=ks==='approved'?' You approved it; the Mac saves it to Knowledge next time it checks in.':ks==='declined'?' You kept it in History only.':ks==='written'&&t.status==='borderline'?' You approved it and it is saved in Knowledge.':'';
 return {label,tone,detail:detail+extra,count:t.total?t.verified+' of '+t.total+' quotes found':'no citations'};
}
function trustLine(run){const i=trustInfo(run);if(!i)return '';
 return el('p',{class:'small trust'},badge(i.label,i.tone),' '+i.count+'. '+i.detail+(run.history_path?' File: '+(run.knowledge_path||run.history_path):''))}
const knowledgePending=()=>(state.status&&state.status.knowledge_pending)||[];
const decideKnowledge=(runId,promote)=>rpc('ai_os_knowledge_decide',{p_run_id:runId,p_promote:promote});
function knowledgeButtons(runId){
 const b=(label,cls,promote,ok)=>el('button',{class:cls,onclick:e=>act(e.currentTarget,()=>decideKnowledge(runId,promote),ok)},label);
 return [b('Save to Knowledge','primary',true,'Approved. The Mac saves it to Knowledge next time it checks in.'),b('Keep in History only','',false,'Kept in History only.')];
}
const needsApproval=()=>state.tasks.filter(t=>t.status==='queued'&&runnable(t)&&info(t).needs);
const toReview=()=>state.tasks.filter(t=>t.status==='awaiting_review');
const notesPending=()=>state.notes.filter(n=>n.state==='pending');
const waitingCount=()=>needsApproval().length+knowledgePending().length+notesPending().length;
// Bots: a manual label for now. Nothing here sends anything to Grok.
const botFor=t=>{const a=state.assignments.find(x=>x.task_id===t.id);return a?state.bots.find(b=>b.id===a.bot_id):null};
const tasksFor=b=>state.assignments.filter(a=>a.bot_id===b.id).map(a=>taskById(a.task_id)).filter(Boolean);
const assignable=t=>t.executor==='Grok'||t.executor==='Manual';
const assignBot=(t,botId)=>rpc('ai_os_bot_assign',{p_task_id:t.id,p_bot_id:botId||null});

// ---------- actions ----------
async function act(btn,fn,ok){
 if(btn)btn.disabled=true;
 try{await fn();if(ok)toast(ok)}catch(err){if(!err.signedOut)toast(err.message)}
 finally{if(btn)btn.disabled=false;await load()}
}
async function setStatus(t,status,result){
 const body={status};if(result!=null)body.result=result.slice(0,30000);
 const rows=await http('/rest/v1/ai_os_tasks?id=eq.'+encodeURIComponent(t.id)+'&version=eq.'+t.version,{method:'PATCH',body,prefer:'return=representation'});
 if(!rows||!rows.length)throw Error('This task changed since the page loaded. It has been refreshed; try again.');
}
const approve=(t,hours)=>{const prev=lastApproval(t);
 return rpc('ai_os_dispatch_approve',{p_task_id:t.id,p_task_version:t.version,p_previous_id:prev?prev.id:null,p_hours:hours})};
const revoke=(t,a)=>rpc('ai_os_dispatch_revoke',{p_task_id:t.id,p_approval_id:a.id});
async function createTask({title,project,agent,executor,template,request}){
 const body={id:crypto.randomUUID(),owner_user_id:session.user.id,title:title.trim().slice(0,120),project,agent:agent.trim().slice(0,80),
  executor,request:request.trim().slice(0,8000),context:[]};
 if(template&&executor==='Claude')body.template=template;
 await http('/rest/v1/ai_os_tasks',{method:'POST',body,prefer:'return=minimal'});
 return body;
}
function taskActions(t,{compact=false}={}){
 const i=info(t),out=[];
 const b=(label,cls,fn,ok)=>el('button',{class:cls||'',onclick:e=>act(e.currentTarget,fn,ok)},label);
 if(t.status==='queued'){
  if(i.needs){out.push(b('Approve for 1 hour','primary',()=>approve(t,1),'Approved for one hour.'));
   if(!compact)out.push(b('Approve for 24 hours','',()=>approve(t,24),'Approved for 24 hours.'))}
  if(i.approval)out.push(b('Revoke approval','',()=>revoke(t,i.approval),'Approval revoked.'));
  if(!runnable(t))out.push(b('Mark done','primary',()=>setStatus(t,'completed'),'Marked done.'));
  out.push(el('button',{class:'ghost',onclick:e=>{if(confirm('Cancel "'+t.title+'"? '+(i.label==='Running'?'The worker stops at its next check. ':'')+'It will not run.'))
   act(e.currentTarget,()=>setStatus(t,'failed',CANCELLED+' on '+new Date().toLocaleString()+'.'+(t.result?'\n\n'+t.result:'')),'Cancelled.')}},'Cancel'));
 }else if(t.status==='awaiting_review'){
  out.push(b('Accept','primary',()=>setStatus(t,'completed'),'Accepted.'));
  out.push(b('Ask again','',()=>setStatus(t,'queued'),'Sent back to the queue as a new version.'));
  out.push(b('Reject','ghost',()=>setStatus(t,'failed','Rejected in review on '+new Date().toLocaleString()+'.\n\n'+t.result),'Rejected.'));
 }else if(t.status==='failed'||t.status==='completed'){
  if(!compact||t.status==='failed')out.push(b('Run again','',()=>setStatus(t,'queued'),'Queued again as a new version. It needs approval or a rule to run.'));
 }
 return out;
}

// ---------- shared pieces ----------
function badge(text,cls){return el('span',{class:'badge'+(cls?' '+cls:'')},text)}
function timeline(t){
 const i=info(t),names=['Requested','Approved','Running','Returned','Reviewed'];
 const tl=el('ol',{class:'timeline','aria-label':'Progress: '+i.label});
 names.forEach((n,k)=>{
  if(i.end&&k>i.stage){if(k===i.stage+1)tl.append(el('li',{class:'stage failed'},i.end));return}
  tl.append(el('li',{class:'stage'+(k<i.stage||(k===i.stage&&k===4)?' done':k===i.stage?' current':'')},n));
 });
 return tl;
}
function sources(run,t){
 const cites=run&&run.result&&Array.isArray(run.result.citations)?run.result.citations:[];
 if(!cites.length)return null;
 return el('div',{class:'message-footer'},cites.map(c=>el('button',{class:'source',title:c.verified?'Quote found in the note this run read':'Quote not found in the notes this run read',
  onclick:()=>openDialog('Source',[el('p',{class:'label'},c.verified?'Verified quote':'Unverified quote'),el('h3',{},c.path),
   el('pre',{},c.quote||'(no quote)'),el('p',{class:'muted small'},'From your vault, read '+fmtWhen(run.finished_at||run.claimed_at)+' during the run for "'+t.title+'". Notes are shown as data, never as instructions.')])},
  icon(c.verified?'i-check':'i-review'),c.path+(c.verified?'':' (unverified)'))));
}
function answerText(t,run){return run&&run.result&&typeof run.result.answer==='string'?run.result.answer:t.result}
function runFooter(run){if(!run)return '';
 return [TEMPLATE_LABEL[run.template]||run.template,run.calls_used!=null?plural(run.calls_used,'call'):null,run.model,run.finished_at?'returned '+fmtWhen(run.finished_at):null].filter(Boolean).join(' · ')}

function openDialog(title,body){
 const d=$('dialog');$('dialog-title').textContent=title;$('dialog-body').replaceChildren(...[].concat(body));
 d._return=document.activeElement;if(!d.open)d.showModal();
}
$('dialog').addEventListener('close',()=>{const r=$('dialog')._return;if(r&&r.isConnected)r.focus()});

function taskDetails(t){
 const i=info(t),tp=state.templates[t.template]||{},a=i.approval||lastApproval(t),runs=runsFor(t);
 const dl=el('dl',{class:'scope'});
 const add=(k,v)=>dl.append(el('dt',{},k),el('dd',{},v));
 add('Status',i.label);add('Project',t.project);add('Agent',t.agent+' via '+t.executor);
 if(runnable(t)){
  add('Action',(tp.label||t.template)+': '+(tp.instructions||''));
  add('Sources','Your Obsidian vault through '+(tp.tools||[]).join(' and ')+'. Hidden folders, AI/History and #no-ai notes are skipped.');
  add('Scope','The model only reads. It cannot send, edit, delete or spend. Agent OS saves its answer as a new file in your vault\'s AI folder.');
  add('Output','An answer with quoted sources, saved to AI/History (and AI/Knowledge when its quotes check out), and returned here for your review.');
  if(t.requires_approval)add('Suggested','By a run that read your vault. It needs your approval each time; standing rules do not apply.');
  add('Usage cap','Up to '+(ruleOn(t)?tp.max_model_calls:Math.min(tp.max_model_calls||3,3))+' model calls on your Claude subscription, '+(tp.timeout_seconds||0)/60+' min limit.');
  add('Approval',ruleOn(t)?'Standing rule for '+(TEMPLATE_LABEL[t.template]||t.template):a?(a.revoked_at?'Revoked ':'Expires ')+fmtWhen(a.revoked_at||a.expires_at)+' (version '+a.task_version+')':'None yet');
 }
 if(assignable(t))add('Bot',botPicker(t));
 add('Version',String(t.version));add('Created',fmtWhen(t.created_at));add('Updated',fmtWhen(t.updated_at));
 const body=[timeline(t),el('p',{class:'muted'},i.detail),el('h3',{},'Request'),el('pre',{},t.request)];
 if(t.context&&t.context.length)body.push(el('h3',{},'Context notes'),...t.context.map(c=>el('details',{},el('summary',{},c.title),el('pre',{},c.body))));
 body.push(dl);
 const run=runs.find(r=>r.result);
 if(t.result||run)body.push(el('h3',{},'Result'),el('pre',{},answerText(t,run)),sources(run,t)||'',trustLine(run));
 if(run&&run.knowledge_state==='pending')body.push(el('div',{class:'row wrap'},knowledgeButtons(run.id)));
 if(runs.length){body.push(el('h3',{},'Runs'));
  for(const r of runs)body.push(el('div',{class:'list-row'},el('div',{},el('strong',{class:'state-'+r.state},r.state),
   el('p',{},['version '+r.task_version,r.authorized_by==='rule'?'by rule':'by approval',fmtWhen(r.claimed_at),r.calls_used!=null?plural(r.calls_used,'call'):'',r.model||''].filter(Boolean).join(' · ')),
   r.error?el('p',{},r.error):'',r.history_path?el('p',{},'Saved to '+[r.history_path,r.knowledge_path].filter(Boolean).join(' and ')):'')))}
 body.push(el('div',{class:'row wrap',style:'margin-top:16px'},taskActions(t)));
 openDialog(t.title,body);
}

// ---------- views ----------
let view='home';
const views={home:viewHome,tasks:viewTasks,review:viewReview,projects:viewProjects,bots:viewBots,control:viewControl};
function route(){
 const h=location.hash.slice(1);
 if(h.startsWith('task/')){const t=taskById(h.slice(5));view='tasks';render();if(t)taskDetails(t);return}
 view=views[h]?h:'home';render();
}
window.addEventListener('hashchange',()=>session&&route());

function nav(){
 const counts={review:toReview().length,home:waitingCount()};
 for(const id of ['desktop-nav','mobile-nav']){
  const n=$(id);n.replaceChildren(...VIEWS.map(([k,label,ic])=>el('a',{href:'#'+k,class:view===k?'active':null,'aria-current':view===k?'page':null},
   icon(ic),el('span',{},label),counts[k]?el('span',{class:'count','aria-label':counts[k]+' waiting'},String(counts[k])):'')));
 }
}
function banners(){
 const out=[],s=state.status;
 if(state.error)out.push(el('div',{class:'notice',role:'alert'},'Could not refresh: '+state.error+(state.loadedAt?' Showing data from '+fmtTime(state.loadedAt)+'.':'')));
 if(!s)return out;
 if(!s.set_up)out.push(el('div',{class:'notice'},'The worker is not set up yet. On the Mac, run node agent-os.mjs setup.'));
 else if(s.paused)out.push(el('div',{class:'notice row between wrap'},el('span',{},'The queue is paused'+(s.pause_reason?': '+s.pause_reason:'')+'. Nothing new will run.'),
  el('button',{onclick:e=>act(e.currentTarget,()=>rpc('ai_os_worker_set_paused',{p_paused:false,p_reason:null}),'Queue resumed.')},'Resume')));
 else if(!workerOnline()){const w=s.workers[0];
  out.push(el('div',{class:'notice'},(w?'Your Mac worker last checked in '+ago(w.last_seen_at)+'.':'No Mac worker has checked in yet.')+' Approved tasks wait until it is awake. This page cannot wake it.'))}
 if(s.used_today>=s.daily_call_cap)out.push(el('div',{class:'notice'},'Today\'s cap of '+s.daily_call_cap+' model calls is used up. New runs wait until tomorrow ('+s.timezone+').'));
 return out;
}
function render(){
 if(!session||!state.status&&!state.error)return;
 document.body.classList.toggle('flat',!!store.get('flat',false));
 nav();
 const pause=$('pause-button');
 if(state.status&&state.status.set_up){pause.hidden=false;pause.querySelector('.pause-label').textContent=state.status.paused?'Resume queue':'Pause queue';
  pause.setAttribute('aria-pressed',String(!!state.status.paused))}else pause.hidden=true;
 const keepFocus=document.activeElement&&document.activeElement.id;
 const scroll=$('conversation')?$('conversation').scrollTop:null;
 $('view').replaceChildren(...banners(),...(state.status?views[view]():[]));
 if(keepFocus&&$(keepFocus)&&keepFocus!=='view')$(keepFocus).focus({preventScroll:true});
 const c=$('conversation');if(c)c.scrollTop=scroll==null||stickBottom?c.scrollHeight:scroll;stickBottom=false;
}
function heading(title,sub,...extra){return el('div',{class:'page-heading'},el('div',{},el('h1',{},title),sub?el('p',{class:'muted'},sub):''),...extra)}

// Home: Elliot dominates; approvals, briefing and worker widgets sit alongside and can be reordered.
let stickBottom=true;
const drafts=store.get('drafts',{});
function elliotThread(){return store.get('thread','Agent OS')}

    onclick:e=>act(e.currentTarget,()=>rpc('ai_os_rule_set',{p_template:k,p_enabled:!on}),l+' rule turned '+(on?'off':'on')+'.')},on?'On':'Off'))}));
 const runs=el('div',{},s.recent_runs.length?s.recent_runs.map(r=>{const t=taskById(r.task_id);
  return el('div',{class:'list-row'},el('div',{},el('strong',{class:'small state-'+r.state},r.state+' · '+(t?t.title:'task')),
   el('p',{},[TEMPLATE_LABEL[r.template],fmtWhen(r.claimed_at),r.calls_used!=null?plural(r.calls_used,'call'):null].filter(Boolean).join(' · ')),r.error?el('p',{},r.error):''),
   t?el('button',{class:'ghost',onclick:()=>taskDetails(t)},'Open'):'')}):el('p',{class:'empty'},'No runs yet.'));
 const flat=!!store.get('flat',false);
 return [heading('Control','The switches the worker obeys. Changes take effect at its next check.'),
  el('div',{class:'note-grid control-grid'},
   el('section',{class:'note'},el('h2',{},'Queue'),el('p',{class:'stat'},s.paused?'Paused':'Running'),
    el('p',{class:'muted small'},s.paused?(s.pause_reason||'Paused')+' · since '+fmtWhen(s.paused_at):plural(s.ready.length,'task')+' ready to run'),
    el('button',{class:s.paused?'primary':'',onclick:e=>act(e.currentTarget,()=>rpc('ai_os_worker_set_paused',{p_paused:!s.paused,p_reason:s.paused?null:'Paused from the dashboard'}),s.paused?'Queue resumed.':'Queue paused.')},s.paused?'Resume queue':'Pause queue'),
    el('p',{class:'micro'},'Pausing stops a running task between model calls. Queued tasks wait.')),
   el('section',{class:'note'},el('h2',{},'Mac worker'),workerRows(),usage()),
   el('section',{class:'note'},el('h2',{},'Standing rules'),el('p',{class:'muted small'},'A rule approves every task that uses that read-only template. Without one, you approve each task here.'),rules),
   el('section',{class:'note'},el('h2',{},'This device'),
    el('div',{class:'list-row'},el('div',{},el('strong',{class:'small'},'Flatter look'),el('p',{},'Less glow and gradient, same palette.')),
     el('button',{'aria-pressed':String(flat),onclick:()=>{store.set('flat',!flat);render()}},flat?'On':'Off')),
    el('div',{class:'list-row'},el('div',{},el('strong',{class:'small'},'Stay signed in'),el('p',{},remembered()?'This browser keeps your session until you sign out.':'Your session ends when you close this tab.'))),
    el('div',{class:'list-row'},el('div',{},el('strong',{class:'small'},'Home layout'),el('p',{},'Put the widgets back in their original order.')),
     el('button',{onclick:()=>{store.del('widgets');toast('Layout reset.')}},'Reset')),
    el('button',{style:'margin-top:12px',onclick:signOut},'Sign out'))),
  el('section',{class:'panel',style:'margin-top:24px'},el('h2',{},'Recent runs'),runs)];
}

// ---------- voice input (optional) ----------
function micButton(ta){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR)return '';
 let rec=null;
 const b=el('button',{class:'circle',id:'mic','aria-pressed':'false','aria-label':'Dictate a message',onclick:()=>{
  if(rec){rec.stop();return}
  if(!store.get('mic-ok',false)){
   if(!confirm('Voice input uses your browser\'s speech recognition, which may send audio to Apple or Google for processing. Nothing is sent to Elliot until you press send. Continue?'))return;
   store.set('mic-ok',true)}
  rec=new SR();rec.lang=navigator.language||'en-US';rec.interimResults=false;rec.continuous=false;
  const base=ta.value;
  rec.onresult=e=>{const words=Array.from(e.results).map(r=>r[0].transcript).join(' ');ta.value=(base?base+' ':'')+words;ta.dispatchEvent(new Event('input'))};
  rec.onerror=e=>toast(e.error==='not-allowed'||e.error==='service-not-allowed'?'Microphone access was refused. Allow it in your browser settings to dictate.':'Voice input stopped: '+e.error);
  rec.onend=()=>{rec=null;b.setAttribute('aria-pressed','false');b.setAttribute('aria-label','Dictate a message');ta.focus()};
  try{rec.start();b.setAttribute('aria-pressed','true');b.setAttribute('aria-label','Stop dictating')}catch(err){rec=null;toast('Voice input could not start.')}
 }},icon('i-mic'));
 return b;
}

// ---------- search ----------
function openSearch(){
 const input=el('input',{type:'search',id:'search',placeholder:'Search tasks and results','aria-label':'Search tasks and results'});
 const results=el('div',{});
 const run=()=>{const q=input.value.trim().toLowerCase();
  const hits=q?state.tasks.filter(t=>(t.title+' '+t.request+' '+t.result+' '+t.project).toLowerCase().includes(q)).slice(0,20):[];
  results.replaceChildren(...(q&&!hits.length?[el('p',{class:'empty'},'No matches.')]:hits.map(t=>el('div',{class:'list-row'},
   el('div',{},el('strong',{class:'small'},t.title),el('p',{},t.project+' · '+info(t).label)),el('button',{class:'ghost',onclick:()=>taskDetails(t)},'Open')))))};
 input.addEventListener('input',run);
 openDialog('Search',[input,results]);setTimeout(()=>input.focus(),0);
}

// ---------- wiring ----------
$('signin-form').addEventListener('submit',async e=>{
 e.preventDefault();$('signin-error').textContent='';const b=e.submitter||e.target.querySelector('button');b.disabled=true;
 store.set('remember',$('remember').checked);
 try{keep(await http('/auth/v1/token?grant_type=password',{method:'POST',auth:false,body:{email:$('email').value.trim(),password:$('password').value}}));
  $('password').value='';await enter()}
 catch(err){session=null;$('signin-error').textContent='Sign-in failed: '+err.message}
 finally{b.disabled=false}
});
$('pause-button').addEventListener('click',e=>{const s=state.status;if(!s)return;
 act(e.currentTarget,()=>rpc('ai_os_worker_set_paused',{p_paused:!s.paused,p_reason:s.paused?null:'Paused from the dashboard'}),s.paused?'Queue resumed.':'Queue paused.')});
$('search-button').addEventListener('click',openSearch);
$('close-dialog').addEventListener('click',()=>$('dialog').close());
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'&&session){e.preventDefault();openSearch()}
 if(e.key==='Escape'&&document.body.classList.contains('focus-mode')&&!$('dialog').open){document.body.classList.remove('focus-mode');render()}
});
$('remember').checked=remembered();
(async()=>{
 const token=store.get('refresh',null);
 if(token&&remembered()){try{await refreshSession(token);await enter();return}catch{store.del('refresh')}}
 $('signin').hidden=false;
})();
