:#f2cd85}.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}.app{display:grid;grid-template-columns:210px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:28px 20px;display:flex;flex-direction:column;gap:32px}.brand{font-size:20px;font-weight:650}.brand-mark{background:linear-gradient(140deg,#527753,#173a27);border:1px solid #90a884;border-radius:13px;width:35px;height:35px;display:grid;place-items:center;color:var(--accent)}.nav{display:grid;gap:5px}.nav a{display:flex;gap:12px;align-items:center;min-height:46px;border-radius:14px;padding:10px 14px;color:var(--muted);text-decoration:none;font-size:14px}.nav a:hover,.nav a.active{background:#244335;color:var(--text)}.sidebar-foot{margin-top:auto}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#244335}.workspace{min-width:0;padding:24px 32px 40px;max-width:1600px;width:100%;margin:auto}.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:24px}.search-button{justify-content:flex-start;max-width:380px;width:100%;color:var(--muted);font-size:14px}.top-actions{display:flex;gap:8px}.preview{border-radius:12px;background:#162c20;border:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:24px}.page-heading{margin-bottom:24px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px}.home-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr);gap:24px}.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:24px;min-width:0}.elliot{background:radial-gradient(ellipse at 5% 0%,#346047 0%,#163e2a 38%,#10251c 80%);border-color:#679675;box-shadow:inset 0 1px 15px #a7d8b517}.orb{width:44px;height:44px;border-radius:50%;background:radial-gradient(circle at 32% 22%,#c3d4a6,#47735a 28%,#132b21 66%);border:1px soli :16px}.dialog-content label.check{display:flex;align-items:center}.check input{width:20px;min-height:20px;accent-color:var(--accent)}.section-intro{max-width:700px;margin-bottom:24px}.empty{padding:20px 0;color:var(--muted)}.focus-mode .sidebar,.focus-mode .topbar,.focus-mode .preview,.focus-mode .support-column,.focus-mode .project-widget,.focus-mode .briefing-widget{display:none}.focus-mode .app{grid-template-columns:1fr}.focus-mode .home-grid{grid-template-columns:1fr}.focus-mode .workspace{max-width:1000px}.focus-mode .conversation{height:55dvh}.flat .elliot{background:var(--surface);box-shadow:none}.flat .orb,.flat .brand-mark{background:#294633;box-shadow:none}.flat dialog::backdrop{backdrop-filter:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}[hidden]{display:none!important}.notice{padding:12px 16px;border:1px solid #86733e;border-radius:14px;color:#ecd497;background:#332b14;margin-bottom:20px}.dragging{opacity:.5}.micro{font-size:12px;color:var(--muted);margin-top:10px}kbd{font-size:12px;border:1px solid var(--line);border-radius:5px;padding:2px 5px}.inline-link{color:var(--accent)}
@media(min-width:1000px){.panel{transition:border-color .15s}.panel:hover{border-color:#63836b}}@media(max-width:1050px){.app{grid-template-columns:175px 1fr}.workspace{padding:24px}.home-grid{grid-template-columns:1fr}.support-column{display:grid;grid-template-columns:1fr 1fr;gap:20px}.support-column .widget{margin:0}.support-column .approval-widget{grid-column:1/-1}.conversation{height:300px}}@media(max-width:700px){.app{display:block}.sidebar{display:none}.workspace{padding:18px 16px calc(104px + env(safe-area-inset-bottom))}.topbar{margin-bottom:16px}.top-actions .pause-label{display:none}.preview{font-size:12px;align-items:flex-start}.preview button{min-height:32px;padding:3px 8px;white-space:nowrap;font-size:12px}.page-heading{margin-bottom:18px}h1{font-size:25px}.page-heading .muted{font-size:13px}.panel{padding:18px;border-radius:24px}.home-grid{gap:16px}.support-column{display:block}.support-column .widget{margin-bottom:16px}.conversation{height:270px}.message{font-size:14px}.mobile-nav{position:fixed;z-index:20;bottom:0;left:0;right:0;background:#071611ed;backdrop-filter:blur(12px);display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom))}.mobile-nav a{color:var(--muted);text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;min-height:48px;min-width:58px;border-radius:14px}.mobile-nav a.active{color:var(--accent);background:#203c2b}.toast{bottom:calc(88px + env(safe-area-inset-bottom))}.thread-select{max-width:125px}.focus-mode .mobile-nav{display:none}.focus-mode .workspace{padding-bottom:24px}.focus-mode .conversation{height:50dvh}.widget-head h2{font-size:18px}.topbar .search-button span{font-size:13px}.search-button kbd{display:none}}

/* Additions for live data */
.signin{max-width:440px;margin:12vh auto 0;padding:0 16px}
.signin .panel{padding:32px}
.signin label{display:grid;gap:6px;margin-bottom:16px}.signin label span{color:var(--muted);font-size:14px}
.signin .check{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px}.signin .check input{width:20px;min-height:20px;accent-color:var(--accent)}
.err{color:#f0b3a1}
.nav a .count,.mobile-nav a .count{margin-left:auto;background:var(--accent);color:var(--ink);border-radius:99px;font-size:11px;font-weight:700;padding:1px 7px;line-height:1.5}
.mobile-nav a{position:relative}.mobile-nav a .count{position:absolute;top:2px;right:8px;margin:0}
.badge.ok{color:#a9d8b2}.badge.danger{color:#f0b3a1}.badge.ok .dot{background:#9fd3a9}.badge.danger .dot{background:#e7a38f}
.timeline{list-style:none;padding:0}.stage.failed{border-color:#e7a38f;color:#f0b3a1}
.message.pending{border-style:dashed}.message.pending p{margin-top:4px;color:var(--muted)}.message.failed{border-color:#86523f}
.review-answer{max-width:none;margin-top:12px}
.trust{margin-top:12px;line-height:1.6}
.obs-link{color:inherit;text-decoration:underline;text-underline-offset:2px;overflow-wrap:anywhere}
.bot.inactive{opacity:.6}.bot .thread-select{flex:1 1 180px;min-width:0;max-width:100%}.note-suggestion pre{white-space:pre-wrap}
.state-returned{color:#a9d8b2}.state-blocked,.state-failed,.state-stale{color:#f0b3a1}.state-running{color:var(--accent)}
.stat{font-size:30px;font-weight:600;line-height:1.2;margin:8px 0 4px}
.note h2{font-size:18px}.note .list-row:first-of-type{padding-top:8px}
.control-grid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.scope dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}.scope dt{opacity:.8}
.cream .scope dt{color:#465848;opacity:1}.cream details summary{min-height:44px;display:flex;align-items:center;cursor:pointer;font-size:14px}
.approval-item:first-child{border-top:0;margin-top:8px;padding-top:4px}
.form-pair{gap:12px;align-items:flex-start}.form-pair label{flex:1 1 160px}
dialog h3{margin:20px 0 8px}dialog details{margin:8px 0}dialog form label{display:grid;gap:6px;margin-bottom:16px}dialog form label span{color:var(--muted);font-size:14px}
.notice.row{padding:8px 8px 8px 16px}
.composer .micro{margin-top:0}
.focus-mode .support-column{display:none}
.widget[draggable=true]{cursor:default}
dialog pre{font-family:inherit}
#pause-button,.brand{white-space:nowrap}
.note-grid{align-items:start}
.elliot{display:flex;flex-direction:column;align-self:start}
.elliot .conversation{height:max(320px,calc(100dvh - 400px))}
.focus-mode .elliot .conversation{height:calc(100dvh - 330px)}
.elliot-head>.row{min-width:0}.elliot-head{flex-wrap:nowrap;align-items:flex-start}
/* Home board */
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes ringIn{from{stroke-dashoffset:var(--full)}}
@keyframes breathe{0%,100%{box-shadow:0 0 14px #98c7a130,0 0 0 0 #9fd3a944}50%{box-shadow:0 0 30px #98c7a160,0 0 0 10px #9fd3a900}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.enter .rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--i,0),14) * 45ms)}
.enter .ring-fill{animation:ringIn 1.1s cubic-bezier(.2,.8,.2,1) both .15s}
.ring-fill{transition:stroke-dashoffset .6s}
.dot.pulse{color:#f2cd8566;animation:pulse 1.8s infinite}.badge.ok .dot.pulse{color:#9fd3a955}
.button-link{color:var(--accent);text-decoration:none;font-size:14px;display:inline-flex;align-items:center;min-height:44px}.button-link:hover{text-decoration:underline}
.hero{display:grid;grid-template-columns:1fr auto;gap:28px;align-items:center;padding:28px 32px;margin-bottom:20px;position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;inset:-40% -10% auto auto;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,#d6be7a1c,transparent 65%);pointer-events:none}
.hero-main{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;min-width:0}.hero-top{gap:16px}.hero h1{font-size:32px}
.hero-orb{width:58px;height:58px;position:relative}.hero-orb.live{animation:breathe 4s ease-in-out infinite}
.hero-orb.busy:before{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid transparent;border-top-color:var(--accent);border-right-color:#d6be7a55;animation:spin 1.4s linear infinite}
.hero-orb.sleep{filter:saturate(.4) brightness(.8)}
.hero-line{font-size:18px;color:var(--text);max-width:640px}
.quick-ask{display:flex;flex-wrap:wrap;align-items:center;gap:8px;background:#0b1f17cc;border:1px solid #66866c;border-radius:20px;padding:6px 6px 6px 16px;max-width:720px;transition:border-color .2s,box-shadow .2s}
.quick-ask:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px #d6be7a22}
.quick-ask>.icon{color:var(--muted)}.quick-ask input{border:0;background:transparent;min-width:0;flex:1 1 120px;padding:10px 4px;outline:none}
.quick-ask input:focus-visible{outline:none}.quick-ask .thread-select{max-width:130px;background:#10251c}
.model-choice{display:grid;gap:4px;min-width:0}.model-choice select{width:100%;max-width:none;min-height:44px}
.quick-ask .model-choice{flex:1 1 120px;max-width:160px}
.elliot-model{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin:16px 0}
.elliot-model .model-choice{max-width:320px}.elliot-model p{margin:0}
.hero-links{gap:16px}.hero-links .micro{margin:0}
.hero-gauge{display:grid;justify-items:center;gap:6px;text-align:center}
.gauge-ring{position:relative;width:118px;height:118px}.gauge-text{position:absolute;inset:0;display:grid;place-content:center;line-height:1.1}
.gauge-text strong{font-size:30px;font-weight:650}.gauge-text span{font-size:12px;color:var(--muted)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.tile{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;justify-items:start;align-items:center;text-align:left;
 padding:16px 18px;border-radius:20px;background:var(--surface);min-height:84px;overflow:hidden;transition:transform .18s,border-color .18s,background .18s}
.tile:hover{transform:translateY(-2px);background:var(--surface);border-color:#63836b}.tile:active{transform:translateY(0) scale(.98)}
.tile-icon{grid-row:1/3;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:#1b3a2b;color:var(--muted)}
.tile-num{font-size:28px;font-weight:650;line-height:1.1;font-variant-numeric:tabular-nums}.tile-label{font-size:13px;color:var(--muted)}
.tile.hot{border-color:#8a7440;background:linear-gradient(135deg,#2c2a16,#10251c 70%)}.tile.hot .tile-icon{background:var(--accent);color:var(--ink)}
.glow{--mx:50%;--my:-200px}
.glow:after{content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .25s;
 background:radial-gradient(260px circle at var(--mx) var(--my),#d6be7a17,transparent 70%)}
.glow:hover:after{opacity:1}
.board{display:grid;gap:20px;align-content:start;min-width:0}
.board-head{margin-top:4px}.board-head h2{font-size:22px}
.filter-bar{display:flex;gap:6px;flex-wrap:wrap}
.chip.filter{gap:8px;padding:4px 12px;min-height:36px;font-size:13px;color:var(--muted)}
.chip.filter.active{background:var(--accent);color:var(--ink);border-color:var(--accent);font-weight:600}
.chip-count{font-size:11px;background:#ffffff14;border-radius:99px;padding:0 7px}.chip.filter.active .chip-count{background:#17291f22}
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px;align-items:start}
.project-card{position:relative;padding:20px;border-radius:22px;background:linear-gradient(180deg,color-mix(in srgb,var(--hue) 9%,var(--surface)),var(--surface) 120px);
 border:1px solid var(--line);border-top:3px solid var(--hue);transition:transform .18s,border-color .18s,box-shadow .18s;display:grid;gap:14px}
.project-card:hover{box-shadow:0 14px 34px #0006;border-color:color-mix(in srgb,var(--hue) 45%,var(--line));border-top-color:var(--hue)}
.pc-head{display:flex;align-items:center;gap:14px}.pc-title{flex:1;min-width:0}.pc-title h2{font-size:19px}.pc-title p{margin-top:2px}
.pc-ring{position:relative;width:52px;height:52px;flex:none}.pc-pct{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:600}
.lane-bar{display:flex;gap:3px;height:8px;border-radius:8px;overflow:hidden}.lane-bar.empty-bar{background:#254636}
.seg{min-width:8px;border-radius:3px}
.lane-needs{--lane:#e7c46f}.lane-review{--lane:#f4eddb}.lane-running{--lane:#9fd3a9}.lane-bot{--lane:#8fb4e3}.lane-queued{--lane:#4f6f5c}
.seg{background:var(--lane)}.seg.lane-running{animation:pulse 1.8s infinite;color:#9fd3a955}
.board-list{display:grid;gap:4px}
.board-row{display:flex;align-items:flex-start;gap:12px;justify-content:flex-start;text-align:left;border:1px solid transparent;border-radius:14px;padding:9px 10px;width:100%;min-height:52px}
.board-row:hover{background:#ffffff08;border-color:var(--line)}

/* Automations tile: futuristic Forest Studio (approved Oct 9; reference design/Automations-Tile-Futuristic.html). */
.auto-tile{position:relative;overflow:hidden;border-radius:24px;padding:20px;height:100%;
 background:linear-gradient(160deg,#173326cc,#0e221acc);border:1px solid #ffffff14;backdrop-filter:blur(10px);
 box-shadow:inset 0 1px 0 #ffffff12,0 0 0 1px #d6be7a10;--mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace}
.auto-tile:before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.35;
 background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:22px 22px;
 -webkit-mask-image:linear-gradient(180deg,transparent,#000 60%);mask-image:linear-gradient(180deg,transparent,#000 60%)}
.auto-tile:after{content:'';position:absolute;left:0;right:0;height:80px;top:-80px;pointer-events:none;background:linear-gradient(180deg,transparent,#9fd3a914,transparent);animation:auto-scan 5s linear infinite}
@keyframes auto-scan{to{top:100%}}
.auto-head{display:flex;align-items:center;gap:12px;position:relative}.auto-head h2{margin:0;font-size:18px}
.auto-core{position:relative;width:44px;height:44px;flex:none}
.auto-core span{position:absolute;border-radius:50%}
.auto-core .o1{inset:2px;border:1.5px dashed #9fd3a980;animation:auto-spin 8s linear infinite}
.auto-core .o2{inset:7px;border:1.2px dashed #d6be7a99;animation:auto-spin 5s linear infinite reverse}
.auto-core .heart{inset:15px;background:#9fd3a9;box-shadow:0 0 12px #9fd3a9,0 0 28px #9fd3a966;animation:auto-beat 1.8s ease-in-out infinite}
.auto-core.calm .heart{background:#e7c46f;box-shadow:0 0 10px #e7c46f88}
@keyframes auto-spin{to{transform:rotate(360deg)}}@keyframes auto-beat{50%{transform:scale(.7)}}
.auto-status{margin:0;font:500 12px var(--mono)}.auto-status.ok{color:#9fd3a9}.auto-status.warn{color:#e7c46f}.auto-status.idle{color:var(--muted)}
.auto-chip{margin-left:auto;font:600 11px var(--mono);letter-spacing:.08em;color:var(--accent);border:1px solid #d6be7a55;border-radius:99px;padding:4px 10px;background:#d6be7a12;white-space:nowrap}
.auto-stream{position:relative;margin:16px 0 6px;height:58px}.auto-stream svg{width:100%;height:100%;overflow:visible}
.auto-stream .path{fill:none;stroke:var(--line);stroke-width:1.5}
.auto-stream .glow{fill:none;stroke:#d6be7a;stroke-width:2;stroke-linecap:round;stroke-dasharray:8 120;animation:auto-flow 2.2s linear infinite;filter:drop-shadow(0 0 4px #d6be7a)}
.auto-stream .g2{stroke:#9fd3a9;animation-delay:-.7s;filter:drop-shadow(0 0 4px #9fd3a9)}.auto-stream .g3{stroke:#8fb4e3;animation-delay:-1.4s;filter:drop-shadow(0 0 4px #8fb4e3)}
.auto-stream.paused .glow{animation-play-state:paused;opacity:.35}
@keyframes auto-flow{from{stroke-dashoffset:128}to{stroke-dashoffset:0}}
.auto-stream .node{position:absolute;font:600 10px var(--mono);letter-spacing:.06em;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px 7px;transform:translateY(-50%)}
.auto-stream .n1{left:0;top:18%}.auto-stream .n2{left:0;top:82%}.auto-stream .n3{right:0;top:50%;color:var(--text);border-color:#d6be7a66;box-shadow:0 0 14px #d6be7a33}
.auto-rows{display:grid;gap:8px;position:relative;margin-top:10px}
.auto-row{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 12px;border-radius:18px;background:#0b1d16b3;border:1px solid #ffffff0d}
.auto-row.ok{color:#9fd3a9}.auto-row.warn{color:#e7c46f}.auto-row.idle{color:var(--muted)}
.auto-ring{width:40px;height:40px}.auto-ring circle{fill:none;stroke-width:3}.auto-ring .track{stroke:#ffffff12}.auto-ring .ticks{stroke:#ffffff26;stroke-dasharray:1 5.28}
.auto-ring .arc{stroke:currentColor;stroke-linecap:round;stroke-dasharray:107;transform:rotate(-90deg);transform-origin:center;filter:drop-shadow(0 0 3px currentColor);
 animation:auto-fill var(--d,60s) linear forwards}
@keyframes auto-fill{from{stroke-dashoffset:var(--from,107)}to{stroke-dashoffset:0}}
.auto-ring.idle{display:block;border-radius:50%;border:3px dashed #ffffff1f;box-sizing:border-box}
.auto-row.warn .arc{animation:none;stroke-dashoffset:0}
.auto-text{min-width:0}.auto-text strong{display:block;color:var(--text);font-size:15px}
.auto-text p{margin:0;font:12px var(--mono);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.auto-pill{font:600 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:99px;padding:4px 9px;border:1px solid currentColor;background:color-mix(in srgb,currentColor 10%,transparent);white-space:nowrap}
.auto-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end;margin-top:16px;position:relative}
.auto-bars{display:flex;gap:4px;align-items:flex-end;height:34px}
.auto-bars i{flex:1;border-radius:3px 3px 1px 1px;background:linear-gradient(180deg,var(--accent),#d6be7a33);transform-origin:bottom;animation:auto-grow 2.8s ease-in-out infinite alternate}
.auto-bars i:last-child{background:linear-gradient(180deg,#9fd3a9,#9fd3a933);box-shadow:0 0 10px #9fd3a955}
@keyframes auto-grow{from{transform:scaleY(.6)}to{transform:scaleY(1)}}
.auto-days{display:flex;gap:4px;font:10px var(--mono);color:var(--muted);opacity:.7;margin-top:4px}.auto-days span{flex:1;text-align:center}
.auto-stat{text-align:right;display:grid}.auto-stat b{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--text);text-shadow:0 0 18px #d6be7a44}
.auto-stat span{font:11px var(--mono);color:var(--muted)}
.flat .auto-tile{background:var(--surface);backdrop-filter:none}.flat .auto-tile:before,.flat .auto-tile:after{display:none}
@media(prefers-reduced-motion:reduce){.auto-tile:after{display:none}.auto-tile *{animation:none!important}.auto-ring .arc{stroke-dashoffset:var(--from,107)}}
/* ---------- Customization (Will's 20 answers, Oct 9) ---------- */
.primary:hover{background:var(--accent-hover,#e3ce98)}
.top-extras{display:flex;gap:8px;align-items:center}

@media(max-width:700px){.top-extras .live-chip{display:none}.top-extras #focus-button{width:44px;padding:0}.focus-label{display:none}}
.nav-more{margin-top:4px}

.more-item:hover{background:#244335}
.tab-row .tab-tools{gap:4px}.w-tool[aria-pressed=true]{background:var(--accent);color:var(--ink);border-color:var(--accent)}

.layout-switch .chip .hue-dot{background:var(--hue)}
.customize-bar .cz-title{display:grid;gap:2px;min-width:0;flex:1 1 260px}.customize-bar .cz-title .micro{margin:0}.cz-tools{gap:8px}
.w-size{width:auto;min-height:36px;padding:4px 8px;font-size:12px;border-radius:10px;background:#0a1d15}
.style-group{margin:12px 0 4px}.style-group .label{margin-bottom:8px}.swatch{width:14px;height:14px;border-radius:50%;border:1px solid #ffffff40}
.button-like{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:9px 15px;border:1px solid var(--line);border-radius:14px;cursor:pointer;margin:0!important}
.button-like:hover{background:#244335}.button-like:focus-within{outline:3px solid var(--accent);outline-offset:3px}
.preview-list{grid-template-columns:140px 1fr}
/* Swipes: the card slides over a hint that says what letting go does. */
.swipe-wrap{position:relative;border-radius:16px;min-width:0}
.swipe{touch-action:pan-y;position:relative;z-index:1;transition:transform .2s cubic-bezier(.2,.8,.2,1)}
.swipe-wrap.swiping .swipe{transition:none}
.swipe-hint{position:absolute;inset:0;display:none;align-items:center;padding:0 20px;border-radius:16px;font:600 12px ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
.swipe-hint.ok{background:#2f5a3e;color:#d9f0dc}.swipe-hint.danger{background:#5a2f25;color:#f6d3c8}
.swipe-hint.left{justify-content:flex-end}
.swiping[data-dir=right] .swipe-hint.right,.swiping[data-dir=left] .swipe-hint.left{display:flex}
.swiping.armed .swipe-hint{box-shadow:inset 0 0 0 2px currentColor}
.swiped-away{display:none}
.approval-item:focus-visible,.task:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.snoozed{opacity:.7}

@keyframes changedGlow{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.changed{outline:2px solid color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:2px;animation:changedGlow 1.2s ease-out 2}

.ctx-menu{position:fixed;z-index:80;min-width:220px;max-width:min(320px,calc(100vw - 16px));display:grid;padding:6px;border-radius:18px;border:1px solid #ffffff1f;
 background:#10251cf2;backdrop-filter:blur(14px);box-shadow:0 18px 50px #000b,inset 0 1px 0 #ffffff12}

.ctx-menu button:focus-visible{outline-offset:-3px}
.ctx-title{margin:6px 10px 4px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#palette-list{display:grid;gap:2px;margin-top:12px}
.cmd{justify-content:space-between;border-color:transparent;text-align:left}.cmd.active{background:#244335;border-color:var(--line)}
.cmd-hint{font:11px ui-monospace,'SF Mono',Menlo,monospace;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}

.ptr{position:fixed;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:55;padding:8px 14px;border-radius:99px;background:#10251cf2;border:1px solid var(--line);
 font:600 12px ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.06em;color:var(--text);box-shadow:0 10px 30px #0008}
/* The extra check for risky approvals (Face ID later) */
.faceid{display:flex;gap:14px;align-items:flex-start;padding:14px 16px;border:1px dashed #e7c46f88;border-radius:18px;background:#332b1455;margin-bottom:12px}
.faceid p{margin:4px 0 0}.faceid-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;border:1px solid #e7c46f66;color:#e7c46f;flex:none}
dialog .swipe-wrap>.approval-item,dialog .faceid~.swipe-wrap .approval-item{background:var(--cream);color:var(--ink);border-radius:18px;padding:16px;border-top:0}
/* Honest states */
.skeleton-list{display:grid;gap:10px;margin-top:12px}.skeleton-row{height:18px;border-radius:9px;background:linear-gradient(90deg,#ffffff0a,#ffffff16,#ffffff0a);background-size:200% 100%;animation:shimmer 1.4s linear infinite}
.skeleton-row:nth-child(2){width:80%}.skeleton-row:nth-child(3){width:60%}

.unknown{margin-top:12px}.unknown-value{font:600 22px/1.1 ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.04em;color:var(--muted);margin:0 0 6px}
.mono-label,.mono{font:600 11px ui-monospace,'SF Mono',Menlo,monospace;letter-spacing:.08em;color:var(--muted)}
.bundle .count-num{display:flex;align-items:flex-end;gap:12px;margin:14px 0 8px}

.goal-list{display:grid;gap:8px;margin-top:12px}.goal-row{display:grid;gap:6px;width:100%;justify-content:stretch;text-align:left;padding:10px 12px;border-radius:14px}

.streak-dot.on{background:var(--accent);box-shadow:0 0 8px color-mix(in srgb,var(--accent) 60%,transparent)}.streak-dot.now{outline:2px solid var(--text);outline-offset:1px}
.filter-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.filter-fields>div{display:grid;gap:6px}.filter-fields label{margin:0!important}

.drill-stat strong{font:600 26px/1.1 ui-monospace,'SF Mono',Menlo,monospace;font-variant-numeric:tabular-nums}.drill-stat span{font-size:12px;color:var(--muted)}

body[data-motion=subtle] .auto-tile:after,body[data-motion=subtle] .auto-core span,body[data-motion=subtle] .auto-stream .glow,body[data-motion=subtle] .auto-bars i,

window.fetch=async(url,options={})=>{
 const req={url:()=>String(url),method:()=>options.method||'GET',postData:()=>options.body||null};
 const route={request:()=>req,fulfill:async({status=200,body=null,contentType})=>new Response(body,{status,headers:contentType?{'Content-Type':contentType}:{}})};
 return (async route=>{
  const req=route.request(),u=new URL(req.url()),p=u.pathname,body=req.postData()?JSON.parse(req.postData()):null;
  const json=(v,status=200)=>route.fulfill({status,contentType:'application/json',body:JSON.stringify(v)});
  // Anything that changes state (reads through RPC, like status, are not counted).
  if(req.method()!=='GET'&&!p.startsWith('/auth/')&&!/ai_os_(worker_status|weekly_summary_preview)$/.test(p))db.writes=(db.writes||0)+1;
  if(p==='/auth/v1/token')return json({access_token:'a',refresh_token:'r'+Math.random(),expires_at:Math.floor(now/1000)+3600,user:{id:OWNER}});
  if(p==='/auth/v1/logout')return route.fulfill({status:204});
  if(p==='/rest/v1/ai_os_owners')return json([{user_id:OWNER}]);
  if(p==='/rest/v1/ai_os_task_templates')return json(db.templates);
  if(p==='/rest/v1/rpc/ai_os_worker_status')return json(db.status());
  if(p==='/rest/v1/ai_os_dispatch_approvals')return json([...db.approvals].reverse());
  if(p==='/rest/v1/ai_os_runs')return json(db.runs);
  if(p==='/rest/v1/rpc/ai_os_rule_set'){db.rules[body.p_template]=body.p_enabled;return json({})}
  if(p==='/rest/v1/rpc/ai_os_chatgpt_rules_set'){db.chatgpt_rules=body.p_enabled;return json({chatgpt_rules:body.p_enabled})}
  if(p==='/rest/v1/rpc/ai_os_knowledge_decide'){const r=db.runs.find(x=>x.id===body.p_run_id);if(r.knowledge_state!=='pending')return json({message:'not pending'},400);
   r.knowledge_state=body.p_promote?'approved':'declined';db.decisions.push(body);return json({run_id:r.id,knowledge_state:r.knowledge_state})}
  if(p==='/rest/v1/ai_os_bots'){
   if(req.method()==='GET')return json(db.bots);
   if(req.method()==='POST'){assert.equal(body.owner_user_id,OWNER);assert.ok(!('connected' in body));db.bots.push({id:'b'+(db.bots.length+1),...body,notes:'',active:true,connected:false,created_at:iso(0)});return route.fulfill({status:201})}
   if(req.method()==='PATCH'){assert.deepEqual(Object.keys(body),['active']);Object.assign(db.bots.find(b=>b.id===u.searchParams.get('id').slice(3)),body);return route.fulfill({status:204})}
  }
  if(p==='/rest/v1/ai_os_routines'){
   if(req.method()==='GET')return json(db.routines);
   if(req.method()==='PATCH'){assert.deepEqual(Object.keys(body),['enabled']);db.routinePatches.push(body);Object.assign(db.routines.find(r=>r.id===u.searchParams.get('id').slice(3)),body);return route.fulfill({status:204})}
   if(req.method()==='POST'){assert.equal(body.owner_user_id,OWNER);assert.ok(!('enabled' in body));db.routines.push({id:'ro'+(db.routines.length+1),...body,enabled:false,last_run_on:null,last_task_id:null});return route.fulfill({status:201})}
  }
  if(p==='/rest/v1/rpc/ai_os_routine_run_now'){const r=db.routines.find(x=>x.id===body.p_id),id='t-r'+db.tasks.length;
   db.tasks.push({id,title:r.name+' · Oct 9',project:r.project,agent:'Jordan',executor:r.executor,template:r.template,request:r.request,context:[],result:'',status:'queued',version:1,created_at:new Date().toISOString(),updated_at:new Date().toISOString()});
   if(r.bot_id)db.assignments.push({task_id:id,bot_id:r.bot_id,assigned_at:iso(0)});return json(id)}
  // Home features: quick actions, goals and milestones are plain owner rows; the audit log is read-only.
  const rowId=()=>u.searchParams.get('id').slice(3);
  if(p==='/rest/v1/ai_os_quick_actions'){
   if(req.method()==='GET')return json(db.quick);
   if(req.method()==='POST'){assert.equal(body.owner_user_id,OWNER);db.quick.push({id:'q'+(db.quick.length+9),...body});return route.fulfill({status:201})}
   if(req.method()==='DELETE'){db.quick=db.quick.filter(q=>q.id!==rowId());return route.fulfill({status:204})}
  }
  if(p==='/rest/v1/ai_os_project_goals'){const proj=()=>decodeURIComponent(u.searchParams.get('project').slice(3));
   if(req.method()==='GET')return json(db.goals);
   if(req.method()==='POST'){assert.equal(body.owner_user_id,OWNER);db.goals.push(body);return route.fulfill({status:201})}
   if(req.method()==='PATCH'){assert.deepEqual(Object.keys(body).sort(),['due_on','goal','updated_at']);Object.assign(db.goals.find(g=>g.project===proj()),body);return route.fulfill({status:204})}
   if(req.method()==='DELETE'){db.goals=db.goals.filter(g=>g.project!==proj());db.milestones=db.milestones.filter(m=>m.project!==proj());return route.fulfill({status:204})}
  }
  if(p==='/rest/v1/ai_os_goal_milestones'){
   if(req.method()==='GET')return json(db.milestones);
   if(req.method()==='POST'){assert.equal(body.owner_user_id,OWNER);db.milestones.push({id:'m'+db.milestones.length,done_at:null,...body});return route.fulfill({status:201})}
   if(req.method()==='PATCH'){assert.deepEqual(Object.keys(body),['done_at']);Object.assign(db.milestones.find(m=>m.id===rowId()),body);return route.fulfill({status:204})}
   if(req.method()==='DELETE'){db.milestones=db.milestones.filter(m=>m.id!==rowId());return route.fulfill({status:204})}
  }
  if(p==='/rest/v1/ai_os_pinned_facts'){
   if(req.method()==='GET')return json(db.pinned);
   if(req.method()==='POST'){assert.equal(body.owner_user_id,OWNER);assert.deepEqual(Object.keys(body).sort(),['fact','owner_user_id','position']);db.pinned.push({id:'p'+(db.pinned.length+9),...body,updated_at:iso(0)});return route.fulfill({status:201})}
   if(req.method()==='DELETE'){db.pinned=db.pinned.filter(f=>f.id!==rowId());return route.fulfill({status:204})}
   if(req.method()==='PATCH'){assert.deepEqual(Object.keys(body).sort(),['fact','updated_at']);db.pinPatches.push(body);Object.assign(db.pinned.find(f=>f.id===rowId()),body);return route.fulfill({status:204})}
  }
  if(p==='/rest/v1/ai_os_audit'){assert.equal(req.method(),'GET');return json(db.audit)}
  if(req.method()==='GET')db.gets[p]=(db.gets[p]||0)+1;
  if(p==='/rest/v1/ai_os_dashboard_layouts'){assert.equal(req.method(),'GET');return json(db.layouts)}
  if(p==='/rest/v1/ai_os_dashboard_prefs'){assert.equal(req.method(),'GET');return json(db.prefs?[db.prefs]:[])}
  if(p==='/rest/v1/ai_os_dashboard_layout_history'){const id=u.searchParams.get('layout_id').slice(3);
   return json(db.layoutHistory.filter(h=>h.layout_id===id).sort((a,b)=>b.version-a.version).slice(0,20))}
  if(p==='/rest/v1/rpc/ai_os_layout_save'){if(db.failLayoutSave&&body.p_name===db.failLayoutSave){db.failLayoutSave=null;return json({message:'Network hiccup.'},503)}const b=body,keys=Object.keys(b.p_data);let l=db.layouts.find(x=>x.id===b.p_id);
   assert.ok(keys.every(k=>['accent','motion','density','widgets','custom','pins','phone','desktop'].includes(k)),'layout keys '+keys);
   if(!['gold','mint','sky','coral','lilac','teal'].includes(b.p_data.accent))return json({message:'The accent must be one of the tested colors'},400);
   if(!l){if(b.p_base_version!=null)return json({message:'This layout was removed on another device'},400);
    l={id:b.p_id,name:b.p_name,position:db.layouts.length,data:b.p_data,version:1,updated_at:iso(0)};db.layouts.push(l)}
   else{if(b.p_base_version!==l.version)return json({message:'This layout changed on another device. It has been refreshed; try again.'},400);Object.assign(l,{name:b.p_name,data:b.p_data,version:l.version+1})}
   db.layoutHistory.push({id:db.layoutHistory.length+1,layout_id:l.id,version:l.version,name:l.name,data:JSON.parse(JSON.stringify(l.data)),source:b.p_source,saved_at:iso(0)});
   const h=db.layoutHistory.filter(x=>x.layout_id===l.id);if(h.length>20)db.layoutHistory.splice(db.layoutHistory.indexOf(h[0]),1);
   return json(l)}
  if(p==='/rest/v1/rpc/ai_os_layout_restore'){const h=db.layoutHistory.find(x=>x.id===body.p_history_id),l=db.layouts.find(x=>x.id===body.p_id);

   {key:'repo-watch',last_run_at:iso(-300000),last_ok:true,last_error:null,next_run_at:iso(600000),runs_week:40,created_week:2,daily_runs:{[today]:12}},

   if(t.version!==body.p_version)return json({message:'Task changed or is not queued'},400);
   (db.checkSaves=db.checkSaves||[]).push(body);Object.assign(t,{checks:body.p_checks,version:t.version+1});return json({task_id:t.id,version:t.version,changed:true})}
  if(p==='/rest/v1/ai_os_tasks'){
   if(req.method()==='GET')return json([...db.tasks].sort((a,b)=>b.created_at.localeCompare(a.created_at)));

  }
  return json({message:'unmocked '+req.method()+' '+p},404);

<script>
'use strict';
// Agent OS dashboard. Talks to Supabase directly with the publishable key and the owner's own
// sign-in. Every read and change is checked by row-level security and owner-checked functions;
// nothing here can bypass them. No service-role key, model key or password is stored.
const BASE='https://preview.example.invalid';
const KEY='preview-no-key';
const PROJECTS=['Agent OS','Insight','Roblox','Growth','Markets','Repo Watch','Team'];
// AI OS was merged into Agent OS on Oct 9; older tasks keep the old name in the database.
const projOf=t=>t.project==='AI OS'?'Agent OS':t.project;
// Elliot's one thread tags each message with a project from the words in it (Will can change the tag
// before sending). This is plain keyword matching with no model call; local triage replaces it later.
const PROJECT_WORDS={'Insight':['insight','wellness','testflight','app store','oura','sleep ring','macro','workout','rep','barcode','posthog','sentry'],
 'Roblox':['roblox','bee','tycoon','game','swarm'],'Growth':['growth','tiktok','content','post','posts','waitlist','marketing','caption','video'],
 'Markets':['market','markets','coin','coins','memecoin','crypto','token','fomo','flip','watchlist'],
 'Repo Watch':['repo','repos','github','skill','skills','library','tool'],'Team':['team','bot','bots','grok','quinn','jordan','riley','drew','casey','rowan','rory','finn'],
 'Agent OS':['agent os','ai os','elliot','worker','dashboard','vault','obsidian','hermes','approval','approvals','routine','brief']};
function guessProject(text){
 const words=' '+String(text).toLowerCase().replace(/[^a-z0-9 ]+/g,' ')+' ';
 let best=null,score=0;
 for(const [p,list] of Object.entries(PROJECT_WORDS)){
  const n=list.filter(w=>words.includes(' '+w+' ')).length+(words.includes(' '+p.toLowerCase()+' ')?2:0);
  if(n>score){best=p;score=n}
 }
 return best;
}
const EXECUTORS=['Claude','ChatGPT','Codex','Grok','Manual'];
// The Mac worker runs template tasks on either subscription. Elliot's model is a per-device choice.
const WORKER_EXECUTORS=['Claude','ChatGPT'];
const askModel=()=>{const m=store.get('model','Claude');return WORKER_EXECUTORS.includes(m)?m:'Claude'};
function modelSelect(id){
 const s=el('select',{class:'thread-select',id,'aria-label':'Which subscription runs it'},WORKER_EXECUTORS.map(m=>el('option',{value:m,selected:askModel()===m?true:null},m)));
 // Both pickers share one choice, so changing one updates the other.
 s.addEventListener('change',()=>{store.set('model',s.value);document.querySelectorAll('#ask-model,#quick-model').forEach(o=>{if(o!==s){o.value=s.value;o.dispatchEvent(new Event('model-sync'))}})});
 return s;
}
const ASK_TEMPLATES=[['research','Ask'],['read','Read a note'],['summarize','Summarize'],['draft','Draft']];
const TEMPLATE_LABEL={read:'Read a note',summarize:'Summarize notes',research:'Research the vault',draft:'Draft text'};
const ERROR_TEXT={model_limit:'Hit the subscription limit',model_error:'The model returned an error',timeout:'Ran out of time',
 tool_violation:'Tried a tool it was not allowed',invalid_output:'Returned an unusable answer',authorization_lost:'Stopped because its approval ended',
 stopped:'Stopped by pause',worker_error:'The Mac worker hit an error',stale:'The worker stopped before returning'};
const CANCELLED='Cancelled from the dashboard';
const VIEWS=[['home','Home','i-home'],['chat','Elliot','i-chat'],['brain','Brain','i-brain'],['tasks','Tasks','i-tasks'],['review','Review','i-review'],['bots','Bots','i-bot'],['control','Control','i-settings']];

// ---------- small helpers ----------
const $=id=>document.getElementById(id);
function el(tag,attrs={},...kids){
 const n=document.createElement(tag);
 for(const [k,v] of Object.entries(attrs||{})){
  if(v==null||v===false)continue;
  if(k==='class')n.className=v;else if(k==='text')n.textContent=v;
  else if(k.startsWith('on')&&typeof v==='function')n.addEventListener(k.slice(2),v);
  else n.setAttribute(k,v===true?'':v);
 }
 for(const k of kids.flat()){if(k==null||k===false)continue;n.append(k)}
 return n;
}
const icon=name=>{const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('class','icon');s.setAttribute('aria-hidden','true');
 const u=document.createElementNS('http://www.w3.org/2000/svg','use');u.setAttribute('href','#'+name);s.append(u);return s};
const store={
 get(k,d){try{const v=localStorage.getItem('agent-os-preview:'+k);return v==null?d:JSON.parse(v)}catch{return d}},
 set(k,v){try{localStorage.setItem('agent-os-preview:'+k,JSON.stringify(v))}catch{}},
 del(k){try{localStorage.removeItem('agent-os-preview:'+k)}catch{}},
};
const fmtTime=t=>t?new Date(t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'';
const fmtWhen=t=>{if(!t)return 'never';const d=new Date(t),now=new Date();
 return d.toDateString()===now.toDateString()?fmtTime(t):d.toLocaleString([], {month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})};
const ago=t=>{if(!t)return 'never';const s=Math.round((Date.now()-new Date(t))/1000);
 if(s<60)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'};
const plural=(n,w)=>n+' '+w+(n===1?'':'s');
let toastTimer;
function toast(msg){const t=$('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,5000)}
// Undo: an approval only starts a run after 10 seconds (the database enforces it), so this button can take it back first.
// The owner wants a quiet five-second button; the backend's ten-second dispatch delay is unchanged.
// Each action keeps its own Undo, independently of later messages.
function undoToast(msg,undo){
 let timer=null;const btn=el('button',{class:'toast-undo','aria-label':'Undo: '+msg},'Undo');
 const row=el('div',{class:'undo-item',role:'group'},btn);
 const end=()=>{clearTimeout(timer);row.remove()};
 btn.onclick=async()=>{end();
  try{await undo();toast('Undone. Nothing ran.')}catch(err){if(!err.signedOut)toast('Could not undo: '+err.message)}finally{await load()}};
 $('undos').append(row);
 timer=setTimeout(end,5000);
}

// ---------- session ----------
let session=null,refreshing=null;
const remembered=()=>!!store.get('remember',false);
async function http(path,{method='GET',body,auth=true,prefer}={}){
 if(auth){if(!session)throw Object.assign(Error('Signed out'),{signedOut:true});
  if(session.expires_at*1000-Date.now()<60000)await refreshSession()}
 const headers={apikey:KEY,Authorization:'Bearer '+(auth?session.access_token:KEY),'Content-Type':'application/json'};
 if(prefer)headers.Prefer=prefer;
 let r;
 try{r=await fetch(BASE+path,{method,headers,body:body===undefined?undefined:JSON.stringify(body)})}
 catch{throw Object.assign(Error('Could not reach Supabase. Check your connection.'),{offline:true})}
 const text=await r.text();let data=null;try{data=text?JSON.parse(text):null}catch{}
 if(!r.ok){
  if(r.status===401&&auth){endSession('Your session ended. Sign in again.');throw Object.assign(Error('Signed out'),{signedOut:true})}
  throw Error((data&&(data.message||data.error_description||data.msg||data.error))||('HTTP '+r.status));
 }

}
function keep(s){session=s;if(remembered()&&s&&s.refresh_token)store.set('refresh',s.refresh_token);rtToken()}
async function refreshSession(token){
 if(refreshing)return refreshing;
 refreshing=(async()=>{try{keep(await http('/auth/v1/token?grant_type=refresh_token',{method:'POST',auth:false,body:{refresh_token:token||session.refresh_token}}))}
  finally{refreshing=null}})();
 return refreshing;
}
const rpc=(name,args={})=>http('/rest/v1/rpc/'+name,{method:'POST',body:args});

  const p=el('span',{class:'burst',style:'left:'+cx+'px;top:'+cy+'px;width:'+size+'px;height:'+size+'px;background:'+cols[i%4]});document.body.append(p);
  p.animate([{transform:'translate(-50%,-50%) scale(1)',opacity:1},{transform:'translate(calc(-50% + '+(Math.cos(a)*d)+'px),calc(-50% + '+(Math.sin(a)*d)+'px)) scale(.3)',opacity:0}],

}

function tabState(){
 const T=P.prefs.tabs||{},defs=tabDefs(),known=new Set(defs.map(d=>d.key));
 const order=(Array.isArray(T.order)?T.order:VIEWS.map(v=>v[0])).filter(k=>known.has(k));

const tplOf=t=>state.templates[t.template]||{};
// Risky: it can write, or it came from outside or from a run. These get the extra check (Face ID later).
const risky=t=>!!tplOf(t).writes||!!t.requires_approval;
const snoozedUntil=t=>{const u=(P.prefs.snoozed||{})[t.id];return u&&new Date(u)>Date.now()?u:null};
function swipeActs(t){
 const i=info(t),cancel={label:'Cancel',tone:'danger',run:n=>deferred('Cancelling "'+t.title+'".',()=>setStatus(t,'failed',CANCELLED+' on '+new Date().toLocaleString()+'.'+(t.result?'\n\n'+t.result:'')),t,n)};
 if(t.status==='queued'&&i.needs&&runnable(t))return {right:{label:'Approve',tone:'ok',run:()=>approveCard(t)},left:cancel};
 if(t.status==='queued'&&!runnable(t))return {right:{label:'Done',tone:'ok',run:n=>deferred('Marking "'+t.title+'" done.',()=>setStatus(t,'completed'),t,n)},left:cancel};
 if(t.status==='awaiting_review')return {right:{label:'Accept',tone:'ok',run:n=>deferred('Accepting "'+t.title+'".',()=>setStatus(t,'completed'),t,n)},
  left:{label:'Reject',tone:'danger',run:n=>deferred('Rejecting "'+t.title+'".',()=>setStatus(t,'failed','Rejected in review on '+new Date().toLocaleString()+'.\n\n'+t.result),t,n)}};

}
// Approving from a swipe, key or menu: the same backend check as the button, and the same 10 s undo.
function approveCard(t){

// Declines and accepts wait 10 seconds before anything is sent, so Undo means nothing reached the database.
function deferred(msg,fn,t,node){

 const timer=setTimeout(async()=>{if(undone)return;try{await fn()}catch(err){if(!err.signedOut)toast(err.message)}finally{swipedAway.delete(t.id);await load()}},10000);
 undoToast(msg+' Sending in 10 seconds.',async()=>{undone=true;clearTimeout(timer);swipedAway.delete(t.id)});

function swipe(node,t){

  const hit=e.target.closest('button,a,input,select,textarea,summary,label');if(hit&&hit!==node)return;
  s={x:e.clientX,y:e.clientY,dx:0,on:false,id:e.pointerId}});

  const a=dx>96?A.right:dx<-96?A.left:null;if(a)a.run(wrap)};

// One WebSocket with the owner's own sign-in; row-level security decides which changes arrive.
// While it is connected the 20-second refresh pauses; if it drops, the refresh takes over again.
const RT_URL=BASE.replace(/^https/,'wss')+'/realtime/v1/websocket?apikey='+encodeURIComponent(KEY)+'&vsn=1.0.0';
const RT_TOPIC='realtime:agent-os';
const RT_TABLES=['ai_os_tasks','ai_os_runs','ai_os_dispatch_approvals','ai_os_note_suggestions','ai_os_learnings','ai_os_fact_proposals','ai_os_rule_proposals','ai_os_decisions','ai_os_dashboard_layouts','ai_os_dashboard_prefs'];
let rt=null,rtLive=false,rtRef=0,rtBeat=null,rtRetry=0,rtTimer=null,rtLoad=null;
const changed=new Set();
function rtSend(m){if(rt&&rt.readyState===1)rt.send(JSON.stringify({...m,ref:String(++rtRef)}))}
function rtStart(){
 if(!session||rt||typeof WebSocket!=='function')return;
 clearTimeout(rtTimer);
 let ws;try{ws=new WebSocket(RT_URL)}catch{return}
 rt=ws;
 ws.onopen=()=>{rtRef=0;rtSend({topic:RT_TOPIC,event:'phx_join',join_ref:'1',payload:{config:{broadcast:{self:false},presence:{key:''},
  postgres_changes:RT_TABLES.map(table=>({event:'*',schema:'public',table}))},access_token:session&&session.access_token}});
  rtBeat=setInterval(()=>rtSend({topic:'phoenix',event:'heartbeat',payload:{}}),25000)};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch{return}
  if(m.topic!==RT_TOPIC)return;
  if(m.event==='phx_reply'&&m.payload&&m.payload.status==='ok'&&!rtLive&&m.ref==='1'){rtLive=true;rtRetry=0;liveChip()}
  else if(m.event==='phx_reply'&&m.payload&&m.payload.status==='error'||m.event==='phx_error'||m.event==='phx_close'||m.event==='system'&&m.payload&&m.payload.status==='error')ws.close();
  else if(m.event==='postgres_changes'){const d=m.payload&&m.payload.data||{},r=d.record||d.old_record||{};
   if(r.id)changed.add(String(r.id));if(r.task_id)changed.add(String(r.task_id));
   clearTimeout(rtLoad);rtLoad=setTimeout(load,250)}};
 ws.onclose=()=>{if(rt!==ws)return;rt=null;rtLive=false;clearInterval(rtBeat);liveChip();
  if(session)rtTimer=setTimeout(rtStart,Math.min(60000,2000*2**rtRetry++))};

// ---------- drill-down: tap a ring or chart for detail, with a range switch ----------
const RANGES=[['today','Today',1],['7d','7 days',7],['30d','30 days',30]];
function dayKeys(n){const out=[];for(let i=n-1;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);out.push(d.getTime())}return out}
const dayOf=t=>{const d=new Date(t);d.setHours(0,0,0,0);return d.getTime()};
function bars(series,label){

 return el('div',{class:'drill-bars',role:'img','aria-label':label+': '+series.map(([d,n])=>new Date(d).toLocaleDateString([], {month:'short',day:'numeric'})+' '+n).join(', ')},
  series.map(([d,n])=>el('span',{class:'drill-bar',title:new Date(d).toLocaleDateString([], {month:'short',day:'numeric'})+': '+n},el('i',{style:'height:'+Math.max(n?6:2,Math.round(100*n/max))+'%;width:100%;max-width:'+w+'px'}))));
}
function drill(kind,arg){

 const chips=el('div',{class:'row wrap',role:'group','aria-label':'Range',id:'drill-range'},RANGES.map(([k,l])=>el('button',{class:'chip filter'+(k===r?' active':''),'aria-pressed':String(k===r),'data-range':k,onclick:()=>{store.set('drill-range',k);drill(kind,arg)}},l)));
 const inRange=t=>t&&new Date(t)>=since,stat=(n,l)=>el('div',{class:'drill-stat'},el('strong',{},String(n)),el('span',{},l));
 const perDay=(items,at,val=()=>1)=>{const m=Object.fromEntries(dayKeys(days).map(d=>[d,0]));for(const x of items){const k=dayOf(at(x));if(k in m)m[k]+=val(x)}return Object.entries(m).map(([d,n])=>[+d,n])};
 let title,body;
 if(kind==='calls'){const runs=state.runs.filter(x=>inRange(x.claimed_at)),calls=runs.reduce((n,x)=>n+(x.calls_used||0),0);
  const byT={};for(const x of runs)byT[x.template]=(byT[x.template]||0)+(x.calls_used||0);
  title='Model calls';body=[el('div',{class:'drill-stats'},stat(calls,'model calls'),stat(runs.length,'runs'),stat(runs.filter(x=>x.state==='returned').length,'returned')),
   days>1?bars(perDay(runs,x=>x.claimed_at,x=>x.calls_used||0),'Model calls per day'):'',
   el('h3',{},'By template'),Object.keys(byT).length?el('div',{},Object.entries(byT).map(([k,n])=>el('div',{class:'list-row'},el('span',{class:'small'},TEMPLATE_LABEL[k]||k),el('strong',{class:'mono'},String(n))))):el('p',{class:'empty'},'No runs in this range.'),
   el('p',{class:'micro'},'Agent OS calls only, from the latest 300 runs. Your Claude subscription allowance is Unknown.')]}
 else if(kind==='project'){const all=state.tasks.filter(t=>projOf(t)===arg),made=all.filter(t=>inRange(t.created_at)),done=all.filter(t=>t.status==='completed'&&inRange(t.updated_at));
  const failed=all.filter(t=>t.status==='failed'&&inRange(t.updated_at)),open=all.filter(isOpen);
  title=arg;body=[el('div',{class:'drill-stats'},stat(made.length,'created'),stat(done.length,'done'),stat(failed.length,'failed'),stat(open.length,'open now')),
   days>1?bars(perDay(done,t=>t.updated_at),'Tasks finished per day'):'',
   el('h3',{},'Open now'),open.length?el('div',{class:'board-list'},open.map(boardRow)):el('p',{class:'empty'},'Nothing open.'),
   el('a',{class:'button-link',href:'#project/'+encodeURIComponent(arg),onclick:()=>$('dialog').close()},'Open the '+arg+' page')]}
 else{const ev=[];for(const t of state.tasks){ev.push(t.created_at);if(t.status==='completed')ev.push(t.updated_at)}
  const inR=ev.filter(inRange);
  title='Activity';body=[el('div',{class:'drill-stats'},stat(state.tasks.filter(t=>inRange(t.created_at)).length,'tasks created'),stat(state.tasks.filter(t=>t.status==='completed'&&inRange(t.updated_at)).length,'finished'),stat(inR.length,'events')),
   days>1?bars(perDay(inR,x=>x),'Events per day'):'',el('p',{class:'micro'},'From the latest 300 tasks.')]}
 openDialog(title+' · '+rangeLabel,[chips,...body]);
}

// ---------- Focus view: only what needs Will, most urgent first; manual only ----------

  el('div',{class:'focus-grid'},
   section('Approvals',approvals.length+other,approvals.length+other?el('div',{class:'cream focus-approvals'},approvalList().filter(n=>{const c=n.querySelector&&n.querySelector('[data-task]'),t=c&&taskById(c.dataset.task);return !t||keep(t)})):el('p',{class:'empty'},'No approvals waiting.')),

  snoozed?el('p',{class:'micro'},plural(snoozed,'snoozed task')+' hidden here until the snooze ends.'):'',
  el('p',{class:'micro'},'Focus only opens when you tap it, and it never switches on by itself.')];
}
